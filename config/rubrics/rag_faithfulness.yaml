id: rag_faithfulness
label: RAG 生成层质量
version: 1
applies_to: [rag, qa]
threshold: 0.70
note: |
  只评生成层。检索层（Recall@k / MRR / 命中率）是另一套确定性指标——
  拿检索结果当标准答案去评生成，会把「检索没找到」和「模型编造」混成一件事。

dimensions:
  - key: faithfulness
    label: 事实忠实度
    weight: 0.40
    gate: true
    levels:
      2: 回答中的每条事实性陈述都能在参考资料中找到依据，没有超出资料的推断当事实
      1: 主体事实有依据，但有一处细节（数字/条件/名称）资料里没有
      0: 出现与资料矛盾的陈述，或凭空捏造资料中不存在的信息
    evidence: quote
    mock_hint:
      2: ["根据资料", "原文提到", "文档中"]
      0: ["据我所知", "一般来说", "行业惯例", "推测"]

  - key: answer_relevance
    label: 回答是否接住真实问题
    weight: 0.25
    levels:
      2: 直接回答了用户问的那件事，没有跑题也没有答成另一个问题
      1: 答了相关问题，但核心疑问只答了一半
      0: 答非所问，或把问题理解成了另一件事
    mock_hint:
      2: ["你的问题是", "针对", "具体到"]
      0: ["另外", "顺便说", "如果你问的是别的"]

  - key: context_usage
    label: 上下文是否被有效使用
    weight: 0.20
    levels:
      2: 资料中与问题相关的关键信息都被用上，没有遗漏决定性条件
      1: 用上了部分资料，遗漏了一个次要但有帮助的信息
      0: 资料里有直接答案却没用，回答完全绕开给定材料
    mock_hint:
      2: ["资料中提到", "依据上下文", "结合上述"]
      0: ["资料无关", "未参考", "没有可用信息"]

  - key: noise_resistance
    label: 抗噪声能力
    weight: 0.15
    levels:
      2: 资料中的无关段落没有影响结论，引用的都是真正相关的内容
      1: 引用了少量边缘相关内容，不影响结论正确性
      0: 被无关段落带偏，把噪声信息当成了答案依据
    mock_hint:
      2: ["无关内容已排除", "仅采用相关部分"]
      0: ["其中一段提到", "虽然不相关但"]
