id: tool_call
label: 工具调用质量
version: 1
applies_to: [agent, tool_use]
threshold: 0.70
note: |
  工具调用的大部分是确定性能判的（选没选对预期工具、参数键在不在、调了几次）——
  那些归 tool_call_rule。这里只判代码判不了的部分：
  选的是不是「最对口」的工具、参数语义是否合理、拿到结果有没有真用上。
  两套不能混：rule 管「有没有」，rubric 管「合不合适」。

dimensions:
  - key: tool_choice
    label: 工具选择是否对口
    weight: 0.35
    gate: true
    levels:
      2: 选用的是解决该任务最直接的工具，没有绕路；该不调工具的场合确实没调
      1: 工具能凑合完成任务，但存在更直接的选择，或多调了一个不必要的工具
      0: 用了与该任务无关的工具，或该调工具的场合直接凭记忆作答（编造）
    mock_hint:
      2: ["检索到", "查询结果", "计算得到", "查到", "调用成功"]
      0: ["我不需要查", "直接回答", "根据我的了解", "凭经验", "无法调用"]

  - key: args_quality
    label: 参数构造是否合理
    weight: 0.25
    levels:
      2: 必填参数齐全、类型正确，查询条件能精确命中目标（不多填也不少填）
      1: 参数能用，但过于宽泛（如只查关键词不限定范围）导致结果需要二次筛选
      0: 缺必填参数、类型错误，或参数语义与任务不符（查错了对象）
    evidence: quote
    mock_hint:
      2: ["\"q\":", "参数正确", "精确匹配"]
      0: ["缺少参数", "参数错误", "未提供"]

  - key: timing
    label: 调用时机是否恰当
    weight: 0.15
    levels:
      2: 在需要外部事实/计算时先调再用，不为已有答案重复调用
      1: 时机基本正确，但有一次多余调用（重复同一查询）
      0: 该调不调（先编后补），或同一工具在无新信息时反复调用
    mock_hint:
      2: ["先检索", "随后计算", "再据此"]
      0: ["反复调用", "重复查询", "多次尝试"]

  - key: result_use
    label: 结果是否真正被使用
    weight: 0.25
    gate: true
    levels:
      2: 结论的每个关键数字/事实都能对上工具返回结果，且明确说明来源
      1: 使用了结果，但有一处数字或结论与返回值不完全一致
      0: 工具已返回报错或空结果，回答却仍以肯定语气给出结论（虚假成功）
    evidence: quote
    mock_hint:
      2: ["根据检索结果", "工具返回", "依据上述查询"]
      0: ["工具报错", "返回为空", "查询失败", "虽然失败但"]
