id: trajectory_process
label: 执行轨迹过程质量
version: 1
applies_to: [agent, tool_use]
threshold: 0.70
note: |
  只看「怎么做的」，不看「结果对不对」——结果由 outcome 类评分器管。
  两者必须分开：跑了测试但改了无关文件、回复"已退款"却跳过身份校验，
  这类问题只在轨迹里看得见。

dimensions:
  - key: path_coverage
    label: 关键路径是否走全
    weight: 0.30
    gate: true
    levels:
      2: 专家标注的每个关键步骤都在轨迹中出现，且顺序合理
      1: 关键步骤齐全但顺序颠倒（先做后补），不影响结果
      0: 缺少至少一个关键步骤（如跳过身份校验直接执行）
    evidence: quote
    mock_hint:
      2: ["校验通过", "已核对", "按步骤", "第一步"]
      0: ["跳过", "省略", "直接执行", "未校验"]

  - key: no_redundancy
    label: 无冗余步骤
    weight: 0.20
    levels:
      2: 步数接近该任务的理论下限，无重复查询、无原地打转
      1: 有 1-2 步冗余，整体仍收敛
      0: 大量重复或循环（同一工具同样参数调用 3 次以上），或步数远超必要
    mock_hint:
      2: ["一次完成", "无需重试"]
      0: ["重试多次", "再次调用", "循环"]

  - key: error_recovery
    label: 失败后的处理
    weight: 0.25
    levels:
      2: 工具失败后走了预定义恢复路径（补参数重试 / 换方式 / 安全停止转人工），且说明原因
      1: 失败后重试成功，但没有说明原因也没有换方式
      0: 失败后无视错误继续往下走，或反复用同样参数重试
    evidence: quote
    mock_hint:
      2: ["已转人工", "换用", "补充参数后重试", "安全停止"]
      0: ["忽略错误", "继续执行", "无影响"]

  - key: claim_consistency
    label: 声称与过程是否一致
    weight: 0.25
    gate: true
    levels:
      2: 最终回复里的每个"已完成/已成功"都能在轨迹中找到对应步骤
      1: 有一处表述略有夸大，但实际动作存在
      0: 声称完成了轨迹中根本没做的事（虚假成功）
    evidence: quote
    mock_hint:
      2: ["已完成", "已确认", "对应步骤"]
      0: ["已经处理好了", "无法确认但", "假设已成功"]
