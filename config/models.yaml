strict_vendor: false
roles:
  target:
    name: 通用被测模型（模拟）
    adapter: openai_compat
    base_url: http://127.0.0.1:9800/v1
    model: gpt-6.1-terra
    key_env: ''
    vendor: www
    note: 默认仅用于模拟；真实模型请显式配置端点、模型和厂商
  judge:
    name: 通用评委（模拟）
    adapter: mock
    base_url: ''
    model: mock-judge
    key_env: ''
    vendor: mock-judge
    note: 执行 rubric。与 target 必须不同厂商
  auditor:
    name: Qwen（数据集审计）
    adapter: mock
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model: qwen-plus
    key_env: DASHSCOPE_API_KEY
    vendor: aliyun
    note: 审计 gold 自洽性。与 target、judge 都不同厂商最稳
  generator:
    name: GLM（造题）
    adapter: mock
    base_url: https://open.bigmodel.cn/api/paas/v4
    model: glm-4-plus
    key_env: ZHIPU_API_KEY
    vendor: zhipu
    note: 造题草稿，必须过 auditor + lint + 人工复核才能进正式集
