    const isHttp = target.value === 'http';
    document.getElementById('httpBox').style.display = isHttp ? 'block' : 'none';
    document.getElementById('modelBox').style.display = isHttp ? 'none' : 'block';
    document.getElementById('mockRow').style.display = 'block';
    document.getElementById('rDual').style.display = isHttp ? 'inline-block' : 'none';
    document.getElementById('dualHint').style.display = isHttp ? 'block' : 'none';
  };
  document.getElementById('rTarget').onchange = tog;
  const scopeSel = document.getElementById('rScope');
  if (scopeSel) scopeSel.onchange = tog;
  tog();

  const tgt = () => {
    const body = document.getElementById('tBody').value.trim();
    let bt = null;
    if (body) { try { bt = JSON.parse(body); } catch(e){ throw new Error('请求体模板不是合法 JSON：'+e.message); } }
    return {url: document.getElementById('tUrl').value.trim(),
            method: document.getElementById('tMethod').value,
            response_path: document.getElementById('tPath').value.trim(),
            timeout: parseInt(document.getElementById('tTimeout').value)||30,
            body_template: bt, api_key: productCfg().api_key};
  };
  const val = id => (document.getElementById(id)||{}).value || '';
  // 实际提交的模型配置：选了角色卡就用角色卡的 base_url + 该角色的本地 Key；
  // 没选则用设置页。两者混用时以「有值的一方」为准，避免出现「模型填了、地址/Key 却是空的」。
  const pickRole = () => (S.pickRole ? (S.roles||[]).find(r=>r.role===S.pickRole) : null);
  const runModelCfg = () => {
    const mc = modelCfg(), r = pickRole();
    if (!r) return mc;
    const rk = roleKeys()[r.role] || '';
    return {
      api_key: rk || mc.api_key,
      base_url: (r.base_url||'').trim() || mc.base_url,
      model: val('rModel').trim() || r.model || mc.model,
      vendor: (r.vendor||'').trim() || mc.vendor,
      source: 'role', key_source: rk ? 'role' : mc.key_source,
    };
  };
  const pickEl = document.getElementById('rModelPick');
  if (pickEl) pickEl.onchange = () => {
    S.pickRole = pickEl.value || '';
    const r = pickRole();
    if (r) document.getElementById('rModel').value = r.model || '';
    const c = runModelCfg();
    document.getElementById('modelAddrNote').textContent =
      `模型 API 地址：${c.base_url || '未设置'}。实际连通性要在运行或探测时才知道，「有 Key」不等于「能连通」。`;
    document.getElementById('modelSrcNote').textContent = r
      ? `当前用「${(roleLabel(r))}」的已保存配置（${r.vendor||'—'} / ${r.model||'—'}）；Key：${keysText(c)}`
      : `当前用手工填写 + 设置页配置；Key：${keysText(c)}`;
  };
  function keysText(c){
    return c.key_source === 'role' ? '已保存的角色 Key'
      : c.key_source === 'settings' ? '设置页 Key' : '未找到（真实调用会被拒绝）';
  }
  const grader = () => val('rGrader') === '__custom__' ? val('rGraderCustom').trim() : val('rGrader');
  document.getElementById('rGrader').onchange = () => { document.getElementById('rGraderCustom').style.display = val('rGrader') === '__custom__' ? 'block' : 'none'; };
  const ver = () => ({
    label: val('vLabel'),
    prompt_ver: val('vPrompt'),
    prompt_note: val('vPromptNote'),
    product_ver: val('vProduct'),
    product_note: val('vProductNote'),
    change_note: val('vNote'),
  });
  const base = () => ({
    api_key: runModelCfg().api_key, base_url: runModelCfg().base_url,
    product: document.getElementById('rProduct').value,
    stage: document.getElementById('rStage').value,
    dataset_id: document.getElementById('rDs').value || null,
    repeat: parseInt((document.getElementById('rRepeat')||{}).value) || 1,
    ...(grader() ? {grader: grader()} : {}),
  });

  document.getElementById('tProbe').onclick = async ()=>{
    const out = document.getElementById('probeOut');
    let t; try { t = tgt(); } catch(e){ return out.innerHTML = `<div class="warn">${esc(e.message)}</div>`; }
    if(!t.url) return out.innerHTML = '<div class="warn">请先填接口地址</div>';
    out.innerHTML = '<p class="empty">正在请求…</p>';
    try{
      const d = await api('/api/probe', {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({...base(), target:t})});
      if(d.ok){
        out.innerHTML = `<div class="warn" style="border-left-color:var(--ok)">
          连通成功 · 用例 ${esc(d.case_id)} · <b class="num">${d.latency_ms}ms</b></div>
          <label>发出去的请求体</label><pre>${esc(JSON.stringify(d.sent,null,1))}</pre>
          <label>取到的输出（交给判分器，${d.extracted_len} 字）</label><pre>${esc(d.extracted)}</pre>`;
      }else{
        out.innerHTML = `<div class="warn"><b>请求失败</b>：${esc(d.error)}</div>
          <label>发出去的请求体</label><pre>${esc(JSON.stringify(d.sent,null,1))}</pre>
          <div class="note">常见原因：接口没启动、端口不对、字段名和你的入参不一致、响应字段路径写错。</div>`;
      }
    }catch(e){ out.innerHTML = `<div class="warn">${esc(e.message)}</div>`; }
  };

  const fill = () => {
    const dv = document.getElementById('rProduct').value;
    const p = S.products.find(x=>x.product===dv);
    const st = document.getElementById('rStage');
    const previousStage = st.value;
    st.innerHTML = (p?.stages || []).map(ss=>
      `<option value="${ss.id}">${esc(ss.name)} · ${esc(ss.task_type)}</option>`).join('');
    if ([...st.options].some(o=>o.value===previousStage)) st.value=previousStage;
    // prompt 下拉只留当前产品/环节的，避免选错别家的模板；
    // 没有产品（独立模型评测）时列出独立模型自己的模板，别把列表清空。
    const rp = document.getElementById('rPrompt');
    if(rp){
      const sid = st.value;
      const prev = rp.value;
      const standalone = !dv || dv === 'standalone_model' || dv === 'standalone_agent';
      const mine = standalone
        ? S.prompts.filter(x=>x.product==='standalone_model' || x.product==='standalone_agent')
        : S.prompts.filter(x=>x.product===dv && x.stage===sid);
      rp.innerHTML = `<option value="">${standalone?'通用默认':'默认'}</option>` + mine.map(x=>
        `<option value="${x.id}">${esc(x.version)}${standalone?' · 独立模型':''}</option>`).join('');
      if ([...rp.options].some(o=>o.value===prev)) rp.value = prev;
    }
  };
  // 默认使用列表中的第一个产品。
  document.getElementById('rProduct').onchange = fill;
  document.getElementById('rStage').onchange = fill;
  const scopeEl = document.getElementById('rScope');
  if(scopeEl) scopeEl.onchange = fill;
  fill();

  document.getElementById('rDual').onclick = async ()=>{
    if(val('rGrader') === '__custom__' && !grader()) return document.getElementById('rMsg').innerHTML = '<div class="warn">请填写自定义评分器名称或组合。</div>';
    let t; try { t = tgt(); } catch(e){ return document.getElementById('rMsg').innerHTML = `<div class="warn">${esc(e.message)}</div>`; }
    if(!t.url) return document.getElementById('rMsg').innerHTML = '<div class="warn">请先填接口地址</div>';
    const model = val('rModel').trim();
    if(!model && runModelCfg().api_key) return document.getElementById('rMsg').innerHTML = '<div class="warn">双跑使用模型基线时，请先填写模型名称（或在上面选一个已保存的被测模型）。</div>';
    // base() 只带产品/环节/数据集/重复次数/评分器；prompt 版本和限制条数必须单独补上，
    // 否则用户在页面上选的 Prompt 版本、填的限制条数到了双跑里会被后端默认值覆盖，报表数字与设定不符。
    const payload = {...base(), model_api_keys:roleKeys(), target: t,
      prompt_id: document.getElementById('rPrompt').value || null,
      limit: parseInt(document.getElementById('rLimit').value) || null,
      ...(model ? {model} : {}), allow_mock_baseline: true, version: ver()};
    const msg = document.getElementById('rMsg');
    try{
      const {job_id} = await api('/api/dual', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
      msg.innerHTML = '<p class="empty">准备中…</p>';
      document.getElementById('rOut').innerHTML = '';
      clearInterval(S.poll);
      S.poll = setInterval(async ()=>{
        const j = await api('/api/jobs/'+job_id);
        if(j.status==='running'){
          msg.innerHTML = `<p class="empty">${esc(j.step||'运行中')}… ${j.elapsed}s</p>`;
        }else if(j.status==='error'){
          clearInterval(S.poll);
          msg.innerHTML = `<div class="warn">失败：${esc(j.error)}</div>`;
        }else{
          clearInterval(S.poll);
          msg.innerHTML = `<div class="warn" style="border-left-color:var(--ok)">
            三份报告已生成：基线 <b>${esc(j.verdict_a)}</b> · 产品 <b>${esc(j.verdict)}</b></div>
            <div style="display:flex;gap:22px;margin:10px 0 4px">
              ${j.reports.map(r=>`<a href="/api/runs/${encodeURIComponent(r.run)}/report" target="_blank"
                style="font-size:15.6px;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--ink)">
                ${esc(r.label)}</a>`).join('')}
            </div>`;
          document.getElementById('rOut').innerHTML =
            `<h2>③ 对照诊断<span class="c">默认显示这一份</span></h2>
             <iframe src="/api/runs/${encodeURIComponent(j.reports[2].run)}/report"></iframe>`;
        }
      }, 900);
    }catch(e){ msg.innerHTML = `<div class="warn">${esc(e.message)}</div>`; }
  };

  document.getElementById('rGo').onclick = async ()=>{
    const say = html => { document.getElementById('rMsg').innerHTML = html; };
    if(val('rGrader') === '__custom__' && !grader()) return say('<div class="warn">请填写自定义评分器名称。</div>');
    const isHttp = document.getElementById('rTarget').value === 'http';
    const scopeVal = val('rScope');
    const standalone = !!scopeVal && scopeVal.indexOf('standalone') === 0;
    const isAgentStandalone = scopeVal === 'standalone_agent';
    let payload = {...base(), model_api_keys:roleKeys()};
    if (standalone) {
      if (!payload.dataset_id || !grader()) return say(`<div class="warn">${isAgentStandalone?'独立 Agent':'独立模型'}评测请先选择评测集和评分器。</div>`);
      payload.scope = scopeVal; delete payload.product; delete payload.stage;
    }
    const mock = document.getElementById('rMock').checked;
    if(isHttp && !mock){
      let t; try { t = tgt(); } catch(e){ return say(`<div class="warn">${esc(e.message)}</div>`); }
      if(!t.url) return say('<div class="warn">请先填接口地址（被测 Agent 或产品的 HTTP 接口）</div>');
      payload.target = t; payload.mock = false;
    }else{
      payload.model = document.getElementById('rModel').value.trim();
      payload.prompt_id = document.getElementById('rPrompt').value || null;
      payload.mock = mock;
      // Agent 独立评测走 mock 时是用数据集里的 mock_trace 回放，不需要模型名。
      if(!payload.model && !payload.mock && !isAgentStandalone) return say('<div class="warn">请先填写模型名称，或勾选本地仿真。</div>');
    }
    payload.limit = parseInt(document.getElementById('rLimit').value)||null;
    payload.version = ver();
    try{
      const {job_id} = await api('/api/runs', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
      document.getElementById('rMsg').innerHTML = '<p class="empty">运行中…</p>';
      clearInterval(S.poll);
      S.poll = setInterval(async ()=>{
        const j = await api('/api/jobs/'+job_id);
        if(j.status==='running'){
          document.getElementById('rMsg').innerHTML = `<p class="empty">运行中… ${j.elapsed}s</p>`;
        }else if(j.status==='error'){
          clearInterval(S.poll);
          document.getElementById('rMsg').innerHTML = `<div class="warn">失败：${esc(j.error)}</div>`;
        }else{
          clearInterval(S.poll);
          document.getElementById('rMsg').innerHTML = `<div class="warn" style="border-left-color:var(--ok)">
            完成，判定 <b>${esc(j.verdict)}</b>。<a href="/api/runs/${j.run_id}/report" target="_blank">在新窗口打开完整报表</a></div>`;
          document.getElementById('rOut').innerHTML =
            `<h2>报表<span class="c">${esc(j.run_id)}</span></h2><iframe src="/api/runs/${j.run_id}/report"></iframe>`;
        }
      }, 900);
    }catch(e){ document.getElementById('rMsg').innerHTML = `<div class="warn">${esc(e.message)}</div>`; }
  };
}

/* ─────────── 总览（跨产品，只看「跑没跑、挂没挂」）─────────── */
async function openRun(rid){
  S.cur = rid;
  location.hash = 'run/' + encodeURIComponent(rid);
  setView('run');
}

async function viewOverview(){
  const v = document.getElementById('view');
  v.innerHTML = '<p class="empty">正在读总览…</p>';
  let d;
  try{ d = await api('/api/overview'); }
  catch(e){ v.innerHTML = `<div class="warn">${esc(e.message)}</div>`; return; }
  const sm = d.summary || {};
  const prods = d.products || [];
  const nStagesAll = sm.n_stages || 0;
  const nRun = sm.n_run || 0;

  const stageRow = (p, st) => {
    const rate = st.pass_rate;
    const lvl = rate==null ? '' : rate>=0.8 ? '' : rate>=0.5 ? 'mid' : 'low';
    const bar = rate==null
      ? '<span style="color:var(--line2)">—</span>'
      : `<span class="ovbar"><i class="${lvl}" style="width:${Math.round(rate*100)}%"></i></span>${pct(rate)}`;
    const verdict = !st.has_run ? '<span class="rbg">未跑过</span>'
      : `<span class="stamp ${st.verdict==='合格'?'pass':''}">${esc(st.verdict)}</span>`;
    const deps = (st.depends_on || []).map(id=>{
      const up = (p.stages||[]).find(x=>x.id===id);
      return `<span class="dep">依赖 → ${esc(up ? up.name : id)}</span>`;
    }).join(' ');
    const when = st.has_run
      ? `<a href="#run/${encodeURIComponent(st.run_id)}" data-run="${esc(st.run_id)}" class="num"
           style="font-size:13.8px;white-space:nowrap">${esc(st.run_id)}</a>
         <div class="dl">${esc(st.when||'')}</div>`
      : '<span style="color:var(--line2)">—</span>';
    return `<tr>
      <td><b style="font-family:var(--kai);font-size:15.6px">${esc(st.name)}</b>
        ${deps ? `<div>${deps}</div>` : ''}
        <div class="dl">${esc(st.id)}</div></td>
      <td class="r" style="min-width:150px;padding-left:14px">${bar}
        ${st.has_run?`<div class="dl">${st.n} 条用例</div>`:''}</td>
      <td class="r" style="padding-left:14px">${verdict}</td>
      <td class="r" style="min-width:190px;padding-left:14px">${when}</td>
      <td style="padding-left:18px;min-width:180px">
        <span style="font-family:var(--mono);font-size:12.6px;color:var(--ink3);
          word-break:break-word;display:block;line-height:1.5">${esc(st.grader||'—')}</span></td>
    </tr>`;
  };

  v.innerHTML = `
    <div class="kpis">
      <div class="kpi"><span>产品数</span><b>${sm.n_products||0}</b></div>
      <div class="kpi"><span>环节数</span><b>${nStagesAll}</b></div>
      <div class="kpi"><span>已跑过</span><b class="${nRun?'hi':''}">${nRun}</b></div>
      <div class="kpi"><span>未跑过</span><b class="${sm.n_never_run?'hi':''}">${sm.n_never_run||0}</b></div>
    </div>
    <div class="note">
      这里只回答「哪个环节还没跑过、哪个一直在挂、哪个产品最近没动过」，
      <b>不排名、不给综合分</b>——指标同名不同义（都叫 precision，各任务的计算方式可能不同），
      横向比分数是错的。结论以各产品自己的达标门为准。
      ${nStagesAll && !nRun ? '<br><b class="bad">还没有跑过任何环节。</b>先去「运行评测」跑一次，这里才有内容。' : ''}
    </div>
    ${prods.length ? prods.map(p=>`
      <h2 style="margin-top:22px">${esc(p.name)}<span class="c">${esc(p.product)} · ${(p.stages||[]).length} 个环节</span></h2>
      ${(p.stages&&p.stages.length) ? `
      <table><thead><tr><th>环节</th><th class="r" style="padding-left:14px">通过率</th>
        <th class="r" style="padding-left:14px">结论</th>
        <th class="r" style="padding-left:14px">最近一次运行</th>
        <th style="padding-left:18px">评分器</th></tr></thead>
      <tbody>${(p?.stages || []).map(st=>stageRow(p, st)).join('')}</tbody></table>`
      : '<p class="empty">这个产品还没有配置环节。</p>'}`).join('')
      : emptyProducts()}
    <div class="endline"></div>`;

  v.querySelectorAll('[data-run]').forEach(a=>{
    a.onclick = e => { e.preventDefault(); openRun(a.dataset.run); };
  });
}

/* ─────────── 模型角色（四个角色 + 三角互评体检）─────────── */
const ROLE_LABEL = {target:'被测 target', judge:'评委 judge', auditor:'审计 auditor', generator:'造题 generator'};
const roleName = k => ROLE_LABEL[k] || k;

async function viewModels(){
  const v = document.getElementById('view');
  v.innerHTML = '<p class="empty">正在读模型角色…</p>';
  let d;
  try{ d = await api('/api/models'); }
  catch(e){ v.innerHTML = `<div class="warn">${esc(e.message)}</div>`; return; }
  S.models = d;
  const roles = Array.isArray(d.roles) ? d.roles : [];

  const card = r => `
    <div class="verbox ${r.role==='target'?'d':'p'}" data-role="${esc(r.role)}">
      <div class="verhead">${esc(roleName(r.role))}</div>
      <div style="font-size:13.8px;color:var(--ink3);margin-bottom:6px">
        厂商 <b class="num">${esc(r.vendor||'—')}</b> · 模型 <b class="num">${esc(r.model||'—')}</b>
        ${r.adapter==='mock' ? '<span class="rbg n" style="margin-left:6px">mock 仿真 · 不出网</span>'
                             : '<span class="rbg y" style="margin-left:6px">配置为真实调用 · 未验证连通</span>'}
      </div>
      <div style="margin-bottom:8px">
        ${roleKeys()[r.role] ? '<span class="rbg y">浏览器已保存角色 Key</span>' : '<span class="rbg n">浏览器未保存角色 Key</span>'}
        <span style="font-size:12.6px;color:var(--ink3)">仅表示本地存在，不代表有效或连通；角色调用不读取环境变量。${r.adapter==='mock'?'当前仿真不会使用 Key。':''}</span>
        <label>浏览器本地角色 Key</label><input data-f="local_key" type="password" autocomplete="off" value="${esc(roleKeys()[r.role]||'')}">
        <button class="ghost mini" data-key-save="${esc(r.role)}">保存本地 Key</button> <button class="ghost mini" data-key-clear="${esc(r.role)}">清除本地 Key</button>
      </div>
      <label>base_url</label><input data-f="base_url" value="${esc(r.base_url||'')}">
      <div class="row" style="gap:12px">
        <div><label>model</label><input data-f="model" value="${esc(r.model||'')}"></div>
        <div><label>adapter</label><select data-f="adapter">
          <option value="mock" ${r.adapter==='mock'?'selected':''}>mock（本地仿真）</option>
          <option value="openai_compat" ${r.adapter!=='mock'?'selected':''}>openai_compat（真实调用）</option>
        </select></div>
      </div>
      <label>vendor（判「是否同源」就比这个字段）</label><input data-f="vendor" value="${esc(r.vendor||'')}">
      <div style="margin-top:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <button class="ghost mini" data-save="${esc(r.role)}">保存这张卡</button>
        <span style="font-size:12.6px;color:var(--ink3);font-family:var(--sans)">${esc(r.note||'')}</span>
      </div>
    </div>`;

  const LV = {ok:['✓','var(--ok)','通过'], warn:['!','#a8791a','警告'], block:['✗','var(--bad)','禁止']};
  const indRow = x => {
    const [ico, col, label] = LV[x.level] || ['?','var(--ink3)', x.level];
    return `<tr>
      <td>${esc(roleName(x.role))} <span style="color:var(--ink3)">→</span> ${esc(roleName(x.peer))}</td>
      <td class="r" style="white-space:nowrap;padding-left:14px"><span style="font-family:var(--hand);font-size:18px;color:${col}">${ico}</span>
        <span style="color:${col};font-size:13.8px;margin-left:5px">${esc(label)}</span></td>
      <td style="color:var(--ink2);padding-left:20px">${esc(x.reason)}</td>
    </tr>`;
  };
  const ind = d.independence || [];
  const nBlock = ind.filter(x=>x.level==='block').length;
  const nWarn = ind.filter(x=>x.level==='warn').length;

  v.innerHTML = `
    <div id="mMsg">${S.modelsMsg||''}</div>
    <div class="note">
      <b>评委必须和被测产品来自不同厂商，同一个模型评自己会宽容。</b>
      角色及独立性关系由后端返回，保存时校验结果以后端配置为准。
      角色 Key 明文保存在浏览器 localStorage，有同源脚本、恶意扩展和共享设备泄露风险；相关请求会发送给本服务。角色模型配置与本地 Key 分别保存。未提供 judge Key 时后端会回退至顶层模型 Key；角色 Key 不替代被测模型 Key。
    </div>
    <h2>角色配置<span class="c">${roles.length} 个 · 可直接改，改完点该卡片的「保存这张卡」</span></h2>
    <div class="cards">${roles.length ? roles.map(card).join('')
      : '<p class="empty">还没有配置任何角色。看 config/models.yaml。</p>'}</div>
    <label style="display:flex;align-items:center;gap:6px;margin-top:16px;font-family:var(--sans);font-size:15px;color:var(--ink2)">
      <input type="checkbox" id="mStrict" ${d.strict_vendor?'checked':''} style="width:auto">
      严格模式：同厂商直接拒绝保存（不勾 = 同厂商只警告）。改这里会立即保存。
    </label>
    <h2 style="margin-top:22px">三角互评体检<span class="c">${nBlock?('有 '+nBlock+' 条禁止'):
      nWarn?('有 '+nWarn+' 条警告'):'全部独立'}</span></h2>
    ${ind.length ? `<table><thead><tr><th>谁 ↔ 谁</th><th class="r" style="padding-left:14px">结论</th>
      <th style="padding-left:20px">依据（后端原话）</th></tr></thead>
      <tbody>${ind.map(indRow).join('')}</tbody></table>`
      : '<p class="empty">角色不全，暂时算不出独立性。请检查后端角色配置。</p>'}
    <div class="endline"></div>`;

  v.querySelectorAll('[data-key-save], [data-key-clear]').forEach(b=>{
    b.onclick = ()=>{
      const cardEl=b.closest('[data-role]'), role=cardEl.dataset.role;
      const input=cardEl.querySelector('[data-f="local_key"]');
      const keys=roleKeys(), value=input.value.trim();
      if(b.hasAttribute('data-key-clear')) delete keys[role];
      else if(value) keys[role]=value;
      else return alert('请输入角色 Key，或点击清除本地 Key。');
      try {
        saveCfg({model_api_keys:keys});
        if(b.hasAttribute('data-key-clear')) input.value='';
        const status=cardEl.querySelector('[data-f="local_key"]').parentElement;
        const keyBadge=Array.from(status.querySelectorAll('.rbg')).find(el=>el.textContent.includes('浏览器'));
        if(keyBadge){ keyBadge.className='rbg '+(keys[role]?'y':'n'); keyBadge.textContent=keys[role]?'浏览器已保存角色 Key':'浏览器未保存角色 Key'; }
        document.getElementById('mMsg').textContent=keys[role]?'角色 Key 已保存到本浏览器，尚未验证。':'角色 Key 已从本浏览器清除。';
      } catch(e){ document.getElementById('mMsg').textContent='本地保存失败：'+e.message; }
    };
  });

  // 单卡保存：只提交这张卡改过的四个字段 + 当前严格模式
  v.querySelectorAll('[data-save]').forEach(b=>{
    b.onclick = async ()=>{
      const cardEl = b.closest('[data-role]');
      const g = f => { const el = cardEl.querySelector(`[data-f="${f}"]`); return el ? el.value.trim() : ''; };
      const roles = {};
      roles[b.dataset.save] = {base_url:g('base_url'), model:g('model'), adapter:g('adapter'), vendor:g('vendor')};
      const strictVal = (document.getElementById('mStrict')||{}).checked === true;
      const msgEl = document.getElementById('mMsg');
      msgEl.innerHTML = '<p class="empty">保存中…</p>';
      try{
        const r = await api('/api/models', {method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({roles, strict_vendor: strictVal})});
        S.modelsMsg = `<div class="warn" style="border-left-color:var(--ok)">已保存
          <b>${esc(roleName(b.dataset.save))}</b>。体检重算：${
            (r.independence||[]).map(x=>`${esc(roleName(x.role))}↔${esc(roleName(x.peer))}
              <b class="${x.level==='ok'?'ok':'bad'}">${esc(x.level)}</b>`).join(' · ')}</div>`;
        viewModels();
      }catch(e){
        // 400 的 detail 是「同源身份冲突」，原样贴出来，不要吞；也不重渲染，保住用户刚填的值
        msgEl.innerHTML = `<div class="warn"><b>保存被拒绝</b>（后端原话，一字未改）：<br>
          <span style="font-family:var(--mono);font-size:14.4px;word-break:break-all">${esc(e.message)}</span>
          <div style="margin-top:6px;color:var(--ink3);font-size:13.8px">
            这就是「同一模型评自己」被拦下来的地方。换个厂商的模型，或把 vendor 改成本产品真实的厂商。</div></div>`;
        S.modelsMsg = msgEl.innerHTML;
        window.scrollTo({top:0, behavior:'smooth'});
      }
    };
  });

  const chk = document.getElementById('mStrict');
  if(chk) chk.onchange = async ()=>{
    try{
      await api('/api/models', {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({roles:{}, strict_vendor: chk.checked})});
      S.modelsMsg = `<div class="warn" style="border-left-color:var(--ok)">严格模式已${chk.checked?'打开':'关闭'}。</div>`;
      viewModels();
    }catch(e){
      chk.checked = !chk.checked;                       // 后端没接受，勾选状态退回去
      document.getElementById('mMsg').innerHTML = `<div class="warn"><b>改严格模式被拒绝</b>（后端原话）：<br>
        <span style="font-family:var(--mono);font-size:14.4px">${esc(e.message)}</span></div>`;
      window.scrollTo({top:0, behavior:'smooth'});
    }
  };
}

/* ─────────── 指标台账（主界面）─────────── */
S.sel = [];
async function viewLedger(){
  const v = document.getElementById('view');
  const prods = S.products;
  if(!S.ledProduct){
    try{
      const all = await api('/api/versions');
      if(all.length){ S.ledProduct = all[0].product; S.ledStage = all[0].stage; }
    }catch(e){}
  }
  const p = prods.find(x=>x.product===S.ledProduct) || prods[0];
  if(!p || !(p.stages||[]).length){ v.innerHTML = emptyProducts(); return; }
  const cur = p.product;
  const st = (p.stages.find(x=>x.id===S.ledStage) || p.stages[0]).id;
  S.ledProduct = cur; S.ledStage = st;
  const d = await api(`/api/ledger?product=${cur}&stage=${st}`);
  S.sel = S.sel.filter(id=>d.rows.some(r=>r.version_id===id));

  const showAll = !!S.ledAll;
  const cols = showAll ? d.metrics : (d.has_core ? d.metrics.filter(m=>m.core) : d.metrics);
  const head = cols.map(m=>`<th class="m">${esc(m.label)}</th>`).join('');
  const body = d.rows.map((r,i)=>{
    const vals = cols.map(m=>{
      const x = r.values[m.key];
      if(x==null) return `<td class="m" style="color:var(--line2)">—</td>`;
      // 与上一行比，给出 ▲▼（不只靠颜色）
      let d2='';
      if(i>0){
        const prev = d.rows[i-1].values[m.key];
        if(prev!=null){
          const df=(x-prev)*100;
          if(Math.abs(df)>=0.05){
            const better = m.higher_better ? df>0 : df<0;
            d2=`<span class="${better?'up':'down'}">${df>0?'▲':'▼'}${Math.abs(df).toFixed(1)}</span>`;
          }
        }
      }
      return `<td class="m"><span class="v">${pct(x)}</span>${d2?`<span class="d2">${d2}</span>`:''}</td>`;
    }).join('');
    const chgP = r.changed.includes('prompt'), chgD = r.changed.includes('product');
    const mark = (hit)=> hit
      ? `<span class="chg">改</span>`
      : '';
    const sel = S.sel.includes(r.version_id);
    return `<tr class="${sel?'sel':''}" data-id="${r.version_id}">
      <td class="fix" style="min-width:0;padding-right:4px">
        <input type="checkbox" data-sel="${r.version_id}" ${sel?'checked':''} style="width:auto">
      </td>
      <td class="fix"><b>${esc(r.label)}</b>${r.repeat>1?`<span class="badge" style="margin-left:5px;color:var(--ink3);font-size:12px">×${r.repeat}</span>`:''}${!r.changed.length?'<span style="color:var(--ink3);font-size:12.6px;margin-left:6px">基线</span>':''}
        ${(r.prompt_note||r.product_note||r.change_note)?`<span class="lnote"
          title="${esc([r.prompt_note&&('P: '+r.prompt_note), r.product_note&&('D: '+r.product_note), r.change_note].filter(Boolean).join(' ｜ '))}">
          ${esc([r.prompt_note, r.product_note, r.change_note].filter(Boolean).join(' · '))}</span>`:''}</td>
      <td class="${chgP?'hit-p':''}">${esc(r.prompt_ver)}${mark(chgP)}</td>
      <td class="${chgD?'hit-d':''}">${esc(r.product_ver)}${mark(chgD)}</td>
      <td><span class="stamp ${r.verdict==='合格'?'pass':''}">${esc(r.verdict)}</span></td>
      <td class="m">${r.n_fatal}</td>
      ${vals}
      <td><a href="/api/runs/${r.run_id}/report" target="_blank" style="font-size:13.8px">详情</a></td>
    </tr>`;
  }).join('');

  v.innerHTML = `
    <div class="row" style="grid-template-columns:220px 260px 1fr;align-items:end">
      <div><label>产品</label><select id="lProduct">${prods.map(x=>`<option value="${x.product}" ${x.product===cur?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>
      <div><label>环节</label><select id="lStage">${(p?.stages || []).map(x=>`<option value="${x.id}" ${x.id===st?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>
      <div style="text-align:right;font-size:13.8px;color:var(--ink3);padding-bottom:6px">
        ${d.product_repo ? `自动读取版本：<span class="num">${esc(d.auto_product_version||'读取失败')}</span>` :
        `版本号将从「设置 → 被测产品仓库」自动读取 <button class="ghost mini" id="toRepo">去设置</button>`}
      </div>
    </div>

    <div class="note">
      每一行是一次评测，横向看指标。勾选任意几行可以并置对比。
      <b>哪一列高亮，就是这次动了哪一列。</b>
      ${d.has_core? `<span style="margin-left:10px">当前显示 ${cols.length} 个核心指标（达标门里的）</span>
      <button class="ghost" id="togAll" style="padding:2px 9px;margin-left:8px;font-size:13.8px">
        ${showAll?'只看核心':'显示全部 '+d.metrics.length+' 个'}</button>`:''}
    </div>

    ${d.rows.length ? `
    <div class="ledwrap"><table class="led"><thead><tr>
      <th class="fix" style="min-width:0"><input type="checkbox" id="selAll" style="width:auto"></th>
      <th class="fix">版本</th><th>prompt</th><th>产品</th><th>判定</th><th class="m">否决</th>
      ${head}<th></th>
    </tr></thead><tbody>${body}</tbody></table></div>
    <div class="bar" id="bar" style="display:${S.sel.length? 'flex':'none'}">
      <span>已选 <b id="selCount">${S.sel.length}</b> 个版本</span>
      <span>
        <button id="doCmp">并置对比</button>
        <button id="clearSel">清空</button>
      </span>
    </div>
    <div id="cmpOut"></div>

    <h2>指标趋势<span class="c">横轴 = 版本顺序，纵轴 = 指标值</span></h2>
    <div class="toolbar">
      <button class="ghost" id="expCsv">导出 CSV</button>
      <button class="ghost" id="expPng">导出趋势图 PNG</button>
      <span style="font-size:13.8px;color:var(--ink3)">${showAll?'当前为全部指标':'默认只画核心指标'}</span>
    </div>
    <div id="trend"></div>
    <div class="legend" id="legend"></div>` :
    `<p class="empty">这个环节还没有评测记录。去「运行评测」跑一次，记得填版本标签。</p>`}`;

  const tg = document.getElementById('togAll');
  if(tg) tg.onclick = ()=>{ S.ledAll = !S.ledAll; viewLedger(); };
  const lpr = document.getElementById('lProduct');
  if(lpr) lpr.onchange = e=>{ S.ledProduct=e.target.value; S.ledStage=null; viewLedger(); };
  const stEl = document.getElementById('lStage');
  if(stEl) stEl.onchange = e=>{ S.ledStage=e.target.value; viewLedger(); };
  const toRepo = document.getElementById('toRepo');
  if(toRepo) toRepo.onclick = ()=> setView('settings');

  const refreshBar = ()=>{
    const bar = document.getElementById('bar');
    const c = document.getElementById('selCount');
    if(bar) bar.style.display = S.sel.length ? 'flex' : 'none';
    if(c) c.textContent = S.sel.length;
  };
  v.querySelectorAll('input[data-sel]').forEach(cb=>{
    cb.onchange = ()=>{
      const id = cb.dataset.sel;
      if(cb.checked){
        if(S.sel.length>=4){ cb.checked=false; return alert('最多同时对比 4 个版本'); }
        S.sel.push(id);
      }else S.sel = S.sel.filter(x=>x!==id);
      cb.closest('tr').classList.toggle('sel', cb.checked);
      refreshBar();
    };
  });
  const all = document.getElementById('selAll');
  if(all) all.onchange = ()=>{
    v.querySelectorAll('input[data-sel]').forEach(cb=>{ cb.checked = all.checked; cb.onchange(); });
  };
  const clr = document.getElementById('clearSel');
  if(clr) clr.onclick = ()=>{ S.sel=[]; viewLedger(); };

  const cmpBtn = document.getElementById('doCmp');
  if(cmpBtn) cmpBtn.onclick = ()=>{
    const rows = S.sel.map(id=>d.rows.find(r=>r.version_id===id)).filter(Boolean);
    if(rows.length<2) return alert('至少选 2 个版本');
    const base = rows[0];
    const head = rows.map((r,i)=>`<th>${esc(r.label)}${i===0?' (基准)':''}<br>
      <span style="font-weight:400;color:var(--ink3);font-size:11.4px">P:${esc(r.prompt_ver)} · 产品:${esc(r.product_ver)}</span></th>`).join('');
    const body = d.metrics.map(m=>{
      const cells = rows.map((r,i)=>{
        const x = r.values[m.key];
        if(x==null) return '<td style="color:var(--line2)">—</td>';
        if(i===0) return `<td>${pct(x)}</td>`;
        const b = base.values[m.key];
        if(b==null) return `<td>${pct(x)}</td>`;
        const df=(x-b)*100;
        if(Math.abs(df)<0.05) return `<td class="flat">${pct(x)} <span class="delta flat">持平</span></td>`;
        const better = m.higher_better ? df>0 : df<0;
        return `<td class="${better?'up':'down'}">${pct(x)}
          <span class="delta">${df>0?'▲':'▼'}${Math.abs(df).toFixed(1)}pt</span></td>`;
      }).join('');
      return `<tr><td>${esc(m.label)}${m.higher_better?'':' <span style="font-size:12px;color:var(--ink3)">(越低越好)</span>'}</td>${cells}</tr>`;
    }).join('');
    const notes = rows.map((r,i)=>i===0?'':
      `<tr><td>相对基准的改动</td><td colspan="${rows.length-1}" style="text-align:left;font-family:var(--sans);font-size:14.4px">
        ${esc(r.label)}：${r.changed.length? r.changed.map(c=>c==='prompt'?'改 prompt':'改产品').join(' + ') : '无版本变化'}
        ${r.change_note? '· '+esc(r.change_note):''}</td></tr>`).join('');

    document.getElementById('cmpOut').innerHTML = `
      <h2>并置对比<span class="c">${rows.length} 个版本 · 第一列为基准</span></h2>
      <div class="cmp"><table class="cmp"><thead><tr><th>指标</th>${head}</tr></thead>
      <tbody>${body}${notes}</tbody></table></div>
      <div class="note">
        涨跌符号已按指标方向处理：「越低越好」的指标（如各类误报率）下降显示为 ▲。<br>
        差异小于 0.05pt 显示「持平」——这个样本量下更小的差异是噪声。
      </div>`;
    document.getElementById('cmpOut').scrollIntoView({behavior:'smooth'});
  };

  // ── 趋势图：纯 SVG 手绘，零依赖，导出 PNG 时样式不会丢 ──
  const COLORS = ['#9C3D0E','#1F4E79','#4A6B2A','#6B4A7A','#8A6A16','#2B5F5A'];
  const drawTrend = ()=>{
    const box = document.getElementById('trend');
    const rows = d.rows;
    const ms = cols.filter(m=>rows.some(r=>r.values[m.key]!=null));
    if(rows.length<2 || !ms.length){
      box.innerHTML = '<p class="empty">至少要有两次评测才能画趋势。再跑一次即可。</p>';
      return;
    }
    const W=900,H=300,PL=46,PR=132,PT=16,PB=46;
    const iw=W-PL-PR, ih=H-PT-PB, n=rows.length;
    const X=i=> n===1? PL+iw/2 : PL+iw*i/(n-1);
    const Y=v=> PT+ih*(1-v);
    let g='';
    [0,0.25,0.5,0.75,1].forEach(v=>{
      const y=Y(v);
      g+=`<line x1="${PL}" y1="${y.toFixed(1)}" x2="${PL+iw}" y2="${y.toFixed(1)}" stroke="#E5E3DD" stroke-width="1"/>`;
      g+=`<text x="${PL-8}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-family="monospace" font-size="10" fill="#8B9099">${(v*100).toFixed(0)}%</text>`;
    });
    g+=`<line x1="${PL}" y1="${PT+ih}" x2="${PL+iw}" y2="${PT+ih}" stroke="#C8C5BC" stroke-width="1"/>`;
    rows.forEach((r,i)=>{
      if(n>7 && i%2===1) return;
      g+=`<text x="${X(i).toFixed(1)}" y="${PT+ih+16}" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#474C55">${esc((r.label||'').slice(0,9))}</text>`;
      if(r.changed && r.changed.length){
        g+=`<text x="${X(i).toFixed(1)}" y="${PT+ih+33}" text-anchor="middle" font-family="monospace" font-size="9" fill="#9C3D0E">${r.changed.map(c=>c==='prompt'?'P':'D').join('+')}</text>`;
      }
    });
    ms.forEach((m,mi)=>{
      const c=COLORS[mi%COLORS.length];
      const pts=rows.map((r,i)=> r.values[m.key]==null? null : [X(i),Y(r.values[m.key])]).filter(Boolean);
      if(pts.length<2) return;
      g+=`<path d="M${pts.map(q=>q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' L')}" fill="none" stroke="${c}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>`;
      pts.forEach(q=>{ g+=`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="2.6" fill="#FFFFFF" stroke="${c}" stroke-width="1.8"/>`; });
      const ly=PT+9+mi*17;
      g+=`<line x1="${PL+iw+14}" y1="${ly}" x2="${PL+iw+28}" y2="${ly}" stroke="${c}" stroke-width="1.8"/>`;
      g+=`<text x="${PL+iw+33}" y="${ly+3.5}" font-family="sans-serif" font-size="10.5" fill="#474C55">${esc(m.label)}</text>`;
    });
    box.innerHTML = `<svg id="trendSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}"
      width="100%" style="max-width:${W}px;display:block">
      <rect x="0" y="0" width="${W}" height="${H}" fill="#FDFBF5"/>${g}
    </svg>`;
    document.getElementById('legend').innerHTML =
      `<span class="hint">横轴＝每一次评测 · P＝只改 prompt · D＝只改产品 · 只画核心指标（全量看上面的表）</span>`;
  };
  drawTrend();

  // ── 导出 CSV（带 BOM，Excel 打开中文不乱码）──
  const expCsv = ()=>{
    const head = ['版本','prompt版本','产品版本','prompt备注','产品备注','判定','否决数','时间',
                  ...cols.map(m=>m.label)];
    const lines = [head];
    d.rows.forEach(r=>lines.push([
      r.label, r.prompt_ver, r.product_ver, r.prompt_note, r.product_note,
      r.verdict, r.n_fatal, r.created_at,
      ...cols.map(m=> r.values[m.key]==null? '' : (r.values[m.key]*100).toFixed(1)+'%')
    ]));
    const csv = '\ufeff' + lines.map(l=>l.map(x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"').join(',')).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
    a.download = `ledger-${cur}-${st}.csv`;
    a.click();
  };

  // ── 导出趋势图 PNG（SVG → canvas）──
  const expPng = ()=>{
    const svg = document.getElementById('trendSvg');
    if(!svg) return alert('还没有趋势图，至少要有两次评测');
    const SCALE = 2;
    const clone = svg.cloneNode(true);
    clone.setAttribute('xmlns','http://www.w3.org/2000/svg');
    clone.setAttribute('width', 900);
    clone.setAttribute('height', 300);
    const data = new XMLSerializer().serializeToString(clone);
    const img = new Image();
    img.onload = ()=>{
      const cv = document.createElement('canvas');
      cv.width = 900*SCALE; cv.height = 300*SCALE;
      const cx = cv.getContext('2d');
      cx.fillStyle = '#FFFFFF'; cx.fillRect(0,0,cv.width,cv.height);
      cx.drawImage(img, 0, 0, cv.width, cv.height);
      cv.toBlob(b=>{
        const a = document.createElement('a');
        a.href = URL.createObjectURL(b);
        a.download = `trend-${cur}-${st}.png`;
        a.click();
      }, 'image/png');
    };
    img.onerror = ()=> alert('导出失败，可以改用 CSV');
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(data);
  };

  const ec = document.getElementById('expCsv'); if(ec) ec.onclick = expCsv;
  const ep = document.getElementById('expPng'); if(ep) ep.onclick = expPng;
}

/* ─────────── 评测版本 ─────────── */
async function viewVersions(){
  const v = document.getElementById('view');
  const list = await api('/api/versions');
  // 版本表只存了 run_id，模型/数据集在运行记录里；补一层映射，
  // 方便对比 prompt 时确认「两次是不是同一个模型、同一套题」。
  let runMap = {};
  try { (await api('/api/runs')).forEach(r => { runMap[r.id] = r; }); } catch(e) {}
  const dsOf = x => x.dataset_id ? String(x.dataset_id).slice(0, 8) : '—';

/* ─────────── A/B ─────────── */
async function viewCompare(){
  const v = document.getElementById('view');
  S.runs = await api('/api/runs');
  const opt = r=>`<option value="${r.id}">${esc(r.started_at)} · ${esc(r.stage)} · ${r.n_cases}条 · ${esc(r.model)}</option>`;
  v.innerHTML = `
    <h2>选择两次运行</h2>
    <div class="row">
      <div><label>A（基准）</label><select id="ca">${S.runs.map(opt).join('')}</select></div>
      <div><label>B（对照）</label><select id="cb">${S.runs.map(opt).join('')}</select></div>
    </div>
    <div class="note">
      归因规则：<b>一次只改一个变量</b>。要判断某个 prompt 版本好不好，A/B 必须同模型、同数据集、同一批用例，只有 prompt 不同。<br>
      差异小于 5 个百分点的，一律视为「同档」，不要当成改进。
    </div>
    <button class="act" id="cGo">对比</button>
    <div id="cOut"></div>`;
  document.getElementById('cGo').onclick = async ()=>{
    const a = document.getElementById('ca').value, b = document.getElementById('cb').value;
    if(a===b) return alert('请选择两次不同的运行');
    const d = await api(`/api/compare?a=${a}&b=${b}`);
    document.getElementById('cOut').innerHTML = `
      ${d.warnings.map(w=>`<div class="warn">${esc(w)}</div>`).join('')}
      <h2>指标差异<span class="c">共同用例 ${d.n_common}</span></h2>
      <table><thead><tr><th>指标</th><th class="r">A</th><th class="r">B</th><th class="r">差值</th><th class="r">判断</th></tr></thead>
      <tbody>${d.metrics.map(m=>{
        const big = Math.abs(m.delta) > 0.05;
        const cls = !big ? '' : (m.delta>0?'ok':'bad');
        return `<tr><td class="num">${esc(m.metric)}</td>
          <td class="r num">${pct(m.a)}</td><td class="r num">${pct(m.b)}</td>
          <td class="r num ${cls}">${m.delta>0?'+':''}${(m.delta*100).toFixed(1)}pt</td>
          <td class="r" style="color:var(--ink3)">${big?(m.delta>0?'B 更好':'A 更好'):'同档'}</td></tr>`;
      }).join('')}</tbody></table>
      <h2>判定发生变化的用例<span class="c">${d.diffs.length}</span></h2>
      ${d.diffs.length ? `<table><thead><tr><th>用例</th><th>分层</th><th>A</th><th>B</th><th>说明</th></tr></thead>
      <tbody>${d.diffs.map(x=>`<tr><td class="num">${esc(x.case_id)}</td>
        <td style="color:var(--ink3)">${esc(x.stratum)}</td>
        <td class="num ${x.a==='pass'?'ok':'bad'}">${esc(x.a)}</td>
        <td class="num ${x.b==='pass'?'ok':'bad'}">${esc(x.b)}</td>
        <td style="color:var(--ink2)">${esc(x.b_note||x.a_note||'')}</td></tr>`).join('')}</tbody></table>`
      : '<p class="empty">两次运行的判定完全一致，没有任何用例翻转。</p>'}`;
  };
}

    const val = id => document.getElementById(id).value.trim();
    const text = val('sBody'); let body = null;
    try { if(text) body = JSON.parse(text); } catch(e){ return document.getElementById('skMsg').textContent = '请求体模板不是合法 JSON：' + e.message; }
    try {
      saveCfg({model_url:val('sModelUrl'), model:val('sModel'), model_key:val('sk'), product_url:val('sProductUrl'), product_method:val('sMethod'), product_path:val('sPath'), product_timeout:Number(val('sTimeout'))||30, product_key:val('sProductKey'), product_body_text:text, product_body:body});
      document.getElementById('skMsg').textContent = '已保存到当前浏览器。'; refreshStat();
    } catch(e){ document.getElementById('skMsg').textContent = '保存失败：' + e.message; }
  };
  const repoBtn = document.getElementById('sRepoSave');
  if(repoBtn) repoBtn.onclick = async ()=>{
    const msg = document.getElementById('sRepoMsg');
    const value = document.getElementById('sRepo').value.trim();
    msg.textContent = '正在保存…';
    try{
      await api('/api/settings', {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({product_repo: value})});
      const back = await api('/api/settings');
      document.getElementById('sRepo').value = back.product_repo || '';
      msg.textContent = back.product_repo
        ? `已保存：${back.product_repo}（台账页会据此读取产品版本号）`
        : '已清空：台账页不再自动读取产品版本号。';
    }catch(e){ msg.textContent = '保存失败：' + e.message; }
  };
  document.getElementById('skClear').onclick = ()=>{
    try { localStorage.removeItem(CFG_KEY); viewSettings(); refreshStat(); } catch(e){ document.getElementById('skMsg').textContent = '清除失败：' + e.message; }
  };
}

async function refreshStat(){
  const ready = !!modelCfg().api_key;
  document.getElementById('stat').innerHTML = `<i style="background:${ready?'var(--ok)':'var(--bad)'}"></i>` +
    (ready?'模型 Key 已配置':'模型 Key 未配置') + '<br><span style="opacity:.7">配置存于当前浏览器</span>';
}

(async ()=>{
  S.products = await api('/api/products');
  await refreshStat();
  const [h, arg] = location.hash.replace('#','').split('/');
  if(h === 'run' && arg) S.cur = decodeURIComponent(arg);   // #run/<id> 可直接深链到某次运行
  setView(['overview','ledger','datasets','prompts','run','versions','adapter','models','settings','modelRun','agentRun','uiRun'].includes(h) ? h : 'overview');
})();
</script>
</body></html>
