:root{
  /* 兼容旧变量名，JS 内联样式不用改 */
  --ink:#2a2420; --ink2:#4a423b; --ink3:#6b6660;
  --paper:#f8f5ee; --sunk:#f2ecdc; --card:#fbf8f1;
  --line:#d9d2c2; --line2:#c2b7a1; --accent:#df6b3c;
  --ok:#3b7a4b; --bad:#c2412d;
  /* 新增 */
  --desk:#a8c8bb; --desk-deep:#93b4a7; --kraft:#dcc8a3; --pad:#f8f2de;
  --hi:#f8dc4c; --blue:#2c4f9e; --pencil:#8e887f;
  --rule:rgba(143,176,212,.30); --rule-red:rgba(217,119,106,.45);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --hand:"LL Hand","Segoe Print","Bradley Hand",cursive;
  --kai:"Kaiti SC","STKaiti","KaiTi","楷体","LXGW WenKai","AR PL UKai CN","Noto Serif CJK SC","Songti SC",serif;
}
*{box-sizing:border-box;margin:0;padding:0}

/* ── 桌面 ─────────────────────────────────────────────────────── */
body{
  background-color:var(--desk);
  background-image:
    repeating-linear-gradient(58deg,rgba(255,255,255,.055) 0 2px,transparent 2px 5px),
    repeating-linear-gradient(-32deg,rgba(0,0,0,.022) 0 1px,transparent 1px 6px),
    radial-gradient(ellipse 90% 70% at 50% 0%,rgba(255,255,255,.14),transparent 72%);
  color:var(--ink);font:15.6px/1.6 var(--sans);-webkit-font-smoothing:antialiased;
}
.num{font-family:var(--hand);font-variant-numeric:tabular-nums;letter-spacing:.01em;font-size:1.06em}
.app{display:grid;grid-template-columns:192px 1fr;min-height:100vh}

/* ── 侧栏：牛皮纸 + 活页孔 ─────────────────────────────────────── */
.side{
  position:sticky;top:0;height:100vh;padding:22px 0 0;overflow-y:auto;
  background-color:var(--kraft);
  background-image:
    repeating-linear-gradient(92deg,rgba(255,255,255,.10) 0 1px,transparent 1px 7px),
    repeating-linear-gradient(4deg,rgba(120,92,40,.05) 0 1px,transparent 1px 5px);
  border-right:1px solid rgba(120,92,40,.35);
  box-shadow:inset -8px 0 14px -12px rgba(42,36,30,.6);
}
/* 活页孔：一列凹陷圆 */
.side::before{
  content:"";position:absolute;left:11px;top:0;bottom:0;width:12px;
  background-image:radial-gradient(circle at 6px 6px,var(--desk-deep) 5.5px,transparent 6px);
  background-size:12px 74px;background-position:0 26px;background-repeat:repeat-y;
  opacity:.85;pointer-events:none;
}
.brand{padding:0 18px 14px 40px;margin-bottom:8px;border-bottom:1.6px solid var(--pencil);
  filter:none}
.brand b{display:block;font-family:var(--kai);font-size:22.8px;font-weight:700;letter-spacing:.04em}
.brand span{display:block;font-family:var(--hand);font-size:12.6px;letter-spacing:.16em;
  color:#7a6440;text-transform:uppercase;margin-top:1px}
.nav{display:flex;flex-direction:column;gap:1px;padding:6px 10px 0 34px}
.nav button{
  position:relative;isolation:isolate;background:none;border:none;text-align:left;
  padding:6px 10px 6px 12px;font-family:var(--kai);font-size:16.8px;color:#5a4a33;
  cursor:pointer;transition:transform .12s,color .12s;
}
.nav button::before{
  content:"";position:absolute;inset:1px 2px;z-index:-1;opacity:0;
  background:var(--paper);border:1.5px solid var(--ink);
  border-radius:4px 2px 5px 3px;filter:url(#ll-wobble-soft);transition:opacity .12s;
}
.nav button:hover{color:var(--ink);transform:rotate(-.4deg)}
.nav button:hover::before{opacity:.55}
.nav button.on{color:var(--ink);font-weight:700;transform:rotate(-.7deg)}
.nav button.on::before{opacity:1;background:var(--paper)}
/* 选中项左边一个小三角，像用铅笔戳的记号 */
.nav button.on::after{
  content:"";position:absolute;left:-12px;top:50%;margin-top:-4px;
  border:4px solid transparent;border-left-color:var(--accent);
}
.stat{position:static;width:100%;padding:12px 16px 14px 40px;
  border-top:1.6px solid var(--pencil);font-family:var(--hand);font-size:13.2px;color:#6d5a38}
.stat i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}

/* ── 主区：纸页 ───────────────────────────────────────────────── */
.main{
  position:relative;margin:20px 24px 26px 0;padding:30px 34px 48px 88px;
  max-width:1560px;
  background-color:var(--paper);
  background-image:repeating-linear-gradient(to bottom,transparent 0 27px,var(--rule) 27px 28px);
  background-position:0 10px;
  box-shadow:
    0 1px 0 rgba(255,255,255,.85) inset,
    0 20px 44px -20px rgba(42,36,30,.5),
    2px 2px 0 var(--kraft),-2px 0 0 #efe9dc;
}
/* 页边红线 */
.main::before{
  content:"";position:absolute;top:0;bottom:0;left:64px;width:1px;
  background:var(--rule-red);opacity:.8;pointer-events:none;
}
/* 贴在上沿的胶带 */
.main::after{
  content:"";position:absolute;top:-12px;left:44px;width:104px;height:24px;
  background:rgba(246,244,236,.66);border-left:1px dashed rgba(140,135,120,.42);
  border-right:1px dashed rgba(140,135,120,.42);
  box-shadow:0 1px 3px rgba(42,36,30,.16);transform:rotate(-2.4deg);
  mix-blend-mode:multiply;pointer-events:none;
}

/* 页头 */
.hd{display:flex;justify-content:space-between;align-items:flex-end;
  padding-bottom:12px;margin-bottom:20px;
  border-bottom:2px solid var(--ink);position:relative}
.hd::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:2px;
  background:var(--pencil);opacity:.35;border-radius:2px}
.hd h1{font-family:var(--kai);font-size:32.4px;font-weight:700;letter-spacing:.03em;
  line-height:1.2;margin-top:2px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='150' height='8'><path d='M1 5 Q 38 1.4 75 4.4 T 149 3.4' fill='none' stroke='%23df6b3c' stroke-width='1.8' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:2px 100%;background-size:150px 8px;
  padding-bottom:8px;display:inline-block}
.eyebrow{font-family:var(--hand);font-size:13.2px;letter-spacing:.2em;
  text-transform:uppercase;color:#8a7452}
h2{font-family:var(--kai);font-size:19.2px;font-weight:700;letter-spacing:.02em;
  margin:24px 0 6px;padding-bottom:6px;display:flex;justify-content:space-between;
  align-items:baseline;border-bottom:1.6px solid var(--pencil)}
h2 .c{font-family:var(--hand);font-size:13.8px;color:var(--ink3);font-weight:400;
  letter-spacing:.02em;text-transform:none}

/* ── 表格：账本（横线为主，竖线极淡；不给行套滤镜） ──────────── */
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:6px 12px 6px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--kai);font-size:15px;color:var(--ink2);font-weight:700;
  border-bottom:2px solid var(--pencil);background:rgba(248,242,222,.5);
  padding:7px 12px 6px 0}
td{font-size:15px;line-height:1.55}
td.r,th.r{text-align:right;padding-right:0}
tr:hover td{background:rgba(248,220,76,.16)}
.click{cursor:pointer}

/* ── 表单 ─────────────────────────────────────────────────────── */
label{display:block;font-family:var(--kai);font-size:15.6px;color:var(--ink2);
  margin:12px 0 3px}
input,select,textarea{
  width:100%;background:transparent;padding:5px 8px;
  font:13px/1.5 var(--sans);color:var(--blue);
  border:none;border-bottom:1.6px solid var(--pencil);border-radius:0;outline:none;
}
input:focus,select:focus,textarea:focus{
  border-bottom-color:var(--accent);background:rgba(248,220,76,.18)}
select{color:var(--ink);cursor:pointer}
textarea{font-family:var(--mono);font-size:14.4px;line-height:24px;min-height:200px;
  background-color:rgba(255,253,246,.6);
  background-image:repeating-linear-gradient(to bottom,transparent 0 23px,var(--rule) 23px 24px);
  border:1.6px solid var(--pencil);border-radius:3px;padding:4px 10px;color:var(--ink2)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:20px}

/* 按钮：手绘边 */
button.act,button.ghost{
  position:relative;isolation:isolate;border:none;cursor:pointer;
  font-family:var(--kai);font-size:16.8px;font-weight:700;letter-spacing:.04em;
  padding:6px 18px;transition:transform .12s;
}
button.act::before,button.ghost::before{
  content:"";position:absolute;inset:-1px;z-index:-1;
  border:2px solid var(--ink);border-radius:7px 3px 8px 4px/4px 8px 3px 7px;
  filter:url(#ll-wobble);background:var(--card);
  box-shadow:1.5px 2px 0 rgba(42,36,30,.13);
}
button.act{background:transparent;color:#fff8f2}
button.act::before{background:var(--accent);border-color:#8f3f1c}
button.ghost{background:transparent;color:var(--ink)}
button.ghost:nth-of-type(2n){transform:rotate(.35deg)}
button.ghost:nth-of-type(2n+1){transform:rotate(-.3deg)}
button.act:hover{transform:rotate(-.5deg) translateY(-1px)}
button.ghost:hover{transform:rotate(.4deg);color:var(--accent)}
button.ghost:hover::before{background:var(--pad)}
button:disabled{opacity:.42;cursor:not-allowed;transform:none!important}

/* ── 提示块 ───────────────────────────────────────────────────── */
.note{position:relative;background:var(--pad);padding:10px 14px 10px 16px;
  font-size:15px;color:var(--ink2);margin:14px 0;
  box-shadow:1px 2px 0 rgba(42,36,30,.06)}
.note::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--accent);filter:url(#ll-wobble-soft)}
.warn{position:relative;background:rgba(194,65,45,.07);padding:10px 14px 10px 16px;
  font-size:15px;color:#8a3226;margin:10px 0;border:1px solid rgba(194,65,45,.28);
  border-radius:3px}
.ok{color:var(--ok)} .bad{color:var(--bad)}
.pill{display:inline-block;font-family:var(--kai);font-size:13.8px;padding:1px 7px 2px;
  border:1.3px solid currentColor;border-radius:3px;transform:rotate(-.6deg)}
iframe{width:100%;height:1300px;border:1.6px solid var(--pencil);background:#fff;border-radius:3px}
a{color:var(--blue);text-decoration:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='90' height='5'><path d='M1 3 Q 22 1 45 2.6 T 89 2.2' fill='none' stroke='%232c4f9e' stroke-width='1.1' stroke-linecap='round' opacity='.55'/></svg>");
  background-repeat:repeat-x;background-position:0 100%;background-size:90px 5px;padding-bottom:2px}
a:hover{color:#1f3b7a;background-size:90px 5px}

/* KPI */
.kpis{display:flex;gap:34px;margin:10px 0 6px;flex-wrap:wrap}
.kpi{min-width:112px;padding-top:4px;border-top:2px solid var(--pencil)}
.kpi span{display:block;font-family:var(--kai);font-size:14.4px;color:var(--ink2);
  margin-bottom:1px}
.kpi b{display:block;font-family:var(--hand);font-weight:400;font-size:32.4px;line-height:1.15;
  letter-spacing:.01em}
.kpi b.hi{background-image:linear-gradient(transparent 24%,rgba(248,220,76,.7) 24% 92%,transparent 92%);
  display:inline-block;padding:0 3px}

.empty{padding:30px 0;color:var(--ink3);font-size:15px;font-family:var(--kai)}

/* 上传区 */
.drop{position:relative;isolation:isolate;padding:22px;cursor:pointer;
  display:flex;align-items:center;gap:14px;transition:transform .12s}
.drop::before{content:"";position:absolute;inset:0;z-index:-1;
  border:1.8px dashed var(--pencil);border-radius:5px 3px 6px 4px;
  background:rgba(255,253,246,.6);filter:url(#ll-wobble-soft)}
.drop:hover{transform:rotate(-.3deg)}
.drop:hover::before{border-color:var(--ink);background:var(--pad)}
.drop.has::before{border-style:solid;border-color:var(--ok);background:rgba(59,122,75,.06)}
.drop .ico{width:30px;height:30px;flex:0 0 30px;display:flex;align-items:center;
  justify-content:center;font-family:var(--hand);font-size:18px;color:var(--ink3);
  border:1.5px solid var(--pencil);border-radius:4px 2px 5px 3px}
.drop.has .ico{border-color:var(--ok);color:var(--ok)}
.drop .txt b{display:block;font-family:var(--kai);font-size:16.8px;font-weight:700}
.drop .txt span{font-size:13.8px;color:var(--ink3)}

.endline{border-bottom:1.6px solid var(--pencil);filter:url(#ll-wobble-soft);height:1px;margin-top:2px}
pre{background:rgba(240,235,222,.7);padding:10px 12px;font:11.5px/1.7 var(--mono);
  white-space:pre-wrap;word-break:break-word;color:var(--ink2);
  border-left:2px solid var(--pencil);border-radius:2px}

/* 版本表单：两侧用不同颜色纸条区分 */
.verbox{position:relative;padding:10px 14px 12px;margin:14px 0;
  background:rgba(255,253,246,.62);border-radius:3px;
  border:1.5px solid var(--pencil)}
.verbox.p{border-color:var(--accent);background:rgba(223,107,60,.055)}
.verbox.d{border-color:#1F4E79;background:rgba(31,78,121,.05)}
.verhead{font-family:var(--kai);font-size:15.6px;font-weight:700;letter-spacing:.06em;
  color:var(--ink2);margin-bottom:0}
.verbox.p .verhead{color:var(--accent)} .verbox.d .verhead{color:#1F4E79}

.legend{display:flex;flex-wrap:wrap;gap:14px;margin:8px 0 2px;font-size:13.8px;color:var(--ink2)}
.legend i{display:inline-block;width:18px;height:3px;margin-right:6px;vertical-align:3px;
  border-radius:2px}
.legend .hint{color:var(--ink3);font-size:13.8px;font-family:var(--kai)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0 10px}

/* ── 台账表 ───────────────────────────────────────────────────── */
.ledwrap{overflow-x:auto;border:1.6px solid var(--pencil);border-radius:3px;
  background:#fbf8f1;box-shadow:1px 2px 0 rgba(42,36,30,.05)}
table.led{border-collapse:separate;border-spacing:0;min-width:100%}
table.led th,table.led td{padding:6px 10px;white-space:nowrap;
  border-bottom:1px solid var(--line)}
table.led th{position:sticky;top:0;z-index:2;background:#f4eeda;
  border-bottom:2px solid var(--pencil);font-size:14.4px}
table.led th.fix,table.led td.fix{position:sticky;left:0;z-index:1;
  background:#fbf8f1;border-right:1px solid var(--line2);min-width:158px}
table.led th.fix{z-index:3;background:#f4eeda}
table.led tr.sel td{background:rgba(248,220,76,.3)}
table.led tr.sel td.fix{background:#f7edc4}
table.led tr:hover td{background:rgba(248,220,76,.15)}
table.led tr:hover td.fix{background:#f6f0dd}
table.led td.m{text-align:right;font-family:var(--hand);font-variant-numeric:tabular-nums;
  min-width:84px;line-height:1.4;font-size:16.8px}
table.led th.m{text-align:right;min-width:84px}
td.m .v{display:block}
td.m .d2{display:block;font-size:12.6px;font-family:var(--sans);margin-top:1px;opacity:.85}
.delta{font-family:var(--hand);font-size:14.4px;margin-left:5px}
.up{color:var(--ok)} .down{color:var(--bad)} .flat{color:var(--ink3)}
table.led input[type=checkbox]{width:auto;accent-color:var(--accent)}

/* 底部操作条：牛皮纸压条 */
.bar{position:sticky;bottom:0;display:flex;justify-content:space-between;align-items:center;
  padding:9px 16px;font-size:15.6px;
  background:var(--kraft);
  background-image:repeating-linear-gradient(92deg,rgba(255,255,255,.1) 0 1px,transparent 1px 7px);
  border-top:2px solid var(--pencil);color:#4a3a22;font-family:var(--kai);
  box-shadow:0 -6px 16px -12px rgba(42,36,30,.7)}
.bar button{position:relative;background:var(--paper);border:1.4px solid var(--ink);
  color:var(--ink);padding:4px 14px;font-family:var(--kai);font-size:16.2px;
  font-weight:700;cursor:pointer;border-radius:4px 2px 5px 3px}
.bar button:hover{background:var(--pad);transform:rotate(-.5deg)}

/* 并置对比表 */
.cmp{margin-top:8px;overflow-x:auto;background:#fbf8f1;border:1.4px solid var(--pencil);
  border-radius:3px;padding:0 4px}
table.cmp{border-collapse:collapse;min-width:100%}
table.cmp th,table.cmp td{padding:7px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.cmp th{font-family:var(--kai);font-size:15px;color:var(--ink2);font-weight:700;
  border-bottom:2px solid var(--pencil);text-align:right;background:rgba(248,242,222,.5)}
table.cmp th:first-child,table.cmp td:first-child{text-align:left}
table.cmp td{font-family:var(--hand);font-variant-numeric:tabular-nums;text-align:right;
  font-size:18px}
table.cmp td:first-child{font-family:var(--kai);font-size:15.6px}

/* 变更标记：P / D */
.chg{display:inline-block;font-family:var(--hand);font-size:12.6px;padding:0 4px;margin-left:5px;
  border:1.2px solid currentColor;border-radius:2px;vertical-align:1px;transform:rotate(-1deg)}
td.hit-p{background:rgba(223,107,60,.13)!important;border-left:3px solid var(--accent)}
td.hit-d{background:rgba(31,78,121,.1)!important;border-left:3px solid #1F4E79}

/* 判定印章 —— 台账/对比里的「合格/不合格」 */
.stamp{display:inline-block;font-family:var(--kai);font-size:15px;font-weight:700;
  letter-spacing:.1em;padding:1px 8px 2px;transform:rotate(-6deg);
  border:2.1px solid var(--bad);color:var(--bad);border-radius:4px;
  filter:url(#ll-rough);opacity:.9;white-space:nowrap}
.stamp.pass{border-color:var(--ok);color:var(--ok)}

.badge{display:inline-block;font-family:var(--hand);font-size:13.2px;padding:1px 6px;
  border:1.3px solid currentColor;border-radius:2px}
.dl{font-family:var(--hand);font-size:13.8px;color:var(--ink3)}

/* 备注小字（台账行内） */
.lnote{display:block;font-size:12.6px;color:var(--ink3);line-height:1.4;
  max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-family:var(--sans)}
.lnote.p::before{content:"P ";font-family:var(--hand);color:var(--accent)}
.lnote.d::before{content:"D ";font-family:var(--hand);color:#1F4E79}


/* 趋势图：纸上的图表，去掉纯白直角框 */
#trend{background:#fdfbf5;border:1.2px solid var(--line);border-radius:3px;
  padding:6px 4px 2px;margin-top:4px}
/* 表头里的英文/版本号用等宽，中文用楷体 */
th.hand{font-family:var(--hand);font-size:14.4px;letter-spacing:.06em}
/* 行内备注（P/D 前缀） */
.lnote{display:block;font-size:12.6px;color:var(--ink3);line-height:1.45;
  max-width:186px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── 总览 / 模型角色 / 复核（新视图，沿用同一套纸墨，不引入新语言）── */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:12px 0 4px}
.cards .verbox{margin:0}
.ovbar{display:inline-block;width:78px;height:9px;vertical-align:-1px;
  border:1.3px solid var(--pencil);border-radius:2px;background:rgba(255,253,246,.75);
  overflow:hidden;margin-right:7px}
.ovbar i{display:block;height:100%;background:var(--ok)}
.ovbar i.mid{background:#b9871c}
.ovbar i.low{background:var(--bad)}
.dep{display:inline-block;font-family:var(--hand);font-size:12.6px;color:var(--blue);
  border-bottom:1.3px dashed var(--line2);margin-top:2px;white-space:nowrap}
.rbg{display:inline-block;font-family:var(--kai);font-size:13.8px;padding:0 6px 1px;
  border:1.3px solid var(--pencil);border-radius:3px;color:var(--ink3);white-space:nowrap}
.rbg.y{color:var(--ok);border-color:var(--ok)}
.rbg.n{color:var(--bad);border-color:var(--bad)}
button.mini{padding:1px 9px;font-size:13.8px}
.cards input,.cards select{font-size:14.4px}

@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .cards{grid-template-columns:1fr}
  .side{position:static;height:auto;padding-bottom:8px}
  .side::before{display:none}
  .nav{flex-direction:row;flex-wrap:wrap;padding-left:16px}
  .stat{position:static}
  .main{margin:12px;padding:22px 20px 40px}
  .main::before{display:none}
  .row{grid-template-columns:1fr}
}
.nav-group{padding:14px 12px 3px;color:var(--ink3);font-size:12px;font-weight:700;letter-spacing:.08em}.grader-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}.grader-card{border:1px solid var(--pencil);padding:10px;background:#fbf8f1}.grader-card summary{cursor:pointer;font-weight:700}.grader-card button{margin-top:8px}@media(max-width:700px){.grader-grid{grid-template-columns:1fr}}
</style>

<body>
<svg aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;overflow:hidden">
  <filter id="ll-wobble" x="-8%" y="-8%" width="116%" height="116%">
    <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="3" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="3.0" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="ll-wobble-soft" x="-8%" y="-8%" width="116%" height="116%">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="1.1" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="ll-rough" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="4" seed="11" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<div class="app">
  <aside class="side">
    <div class="brand"><b>评测平台</b><span>local only</span></div>
    <nav class="nav" id="nav">
      <button data-v="overview">总览 / 使用引导</button>
      <div class="nav-group">准备评测</div>
      <button data-v="models">模型与 API 配置</button><button data-v="datasets">测试集</button><button data-v="prompts">Prompt 管理</button><button data-v="adapter">产品接入（可选）</button>
      <div class="nav-group">开始评测</div>
      <button data-v="modelRun">模型评测</button><button data-v="agentRun">Agent 评测</button><button data-v="uiRun">产品界面评测</button>
      <div class="nav-group">查看结果</div>
      <button data-v="runs">运行记录与报告</button><button data-v="compare">指标对比</button><button data-v="ledger">指标台账</button>

    </nav>
    <div class="stat" id="stat">检查中…</div>
  </aside>

  <main class="main">
    <div class="hd">
      <div><div class="eyebrow" id="eyebrow">Datasets</div><h1 id="title">评测集</h1></div>
      <div style="text-align:right">
        <div id="hdmeta" style="font-size:13.2px;color:var(--ink3)"></div>
        <div style="font-family:var(--hand);font-size:15px;letter-spacing:.08em;color:#8a7452;
             margin-top:2px" id="hddate"></div>
      </div>
    </div>
    <div id="view"></div>
  </main>

<script>
const S = {products:[], datasets:[], prompts:[], roles:[], runs:[], view:'overview', cur:null, poll:null, pickRole:''};

/* 配置只保存在当前浏览器；请求时临时注入，避免写入后端。localStorage 不是安全存储：同源脚本可读取，勿在共享/不可信浏览器保存生产密钥。 */
const CFG_KEY = 'eval-platform.api-config.v1';
function loadCfg(){
  try { return JSON.parse(localStorage.getItem(CFG_KEY) || '{}') || {}; } catch(e){ return {}; }
}
function saveCfg(patch){
  const next = {...loadCfg(), ...patch};
  localStorage.setItem(CFG_KEY, JSON.stringify(next));
  return next;
}
function clearCfg(){ try { localStorage.removeItem(CFG_KEY); } catch(e) {} }
function roleKeys(){ const keys=loadCfg().model_api_keys; return keys && typeof keys==='object' && !Array.isArray(keys) ? Object.fromEntries(Object.entries(keys).filter(([k,v])=>typeof v==='string' && v.trim()).map(([k,v])=>[k,v.trim()])) : {}; }
/* 被测模型配置有两个可写入口：
   ①「设置」页的顶层 model / model_url / model_key；
   ②「模型与API配置」页的 target 角色卡（存后端 /api/models，Key 存本地 model_api_keys.target）。
   两处都写过时以设置页为准；设置页没写的项回退到 target 角色卡，否则在角色卡里配好了模型、
   评测页却显示「未配置」。 */
function targetRole(){
  const rs = (typeof S !== 'undefined' && S.roles) || [];
  return rs.find(r=>r && r.role==='target') || null;
}
function modelCfg(){
  const c = loadCfg();
  const tr = targetRole() || {};
  const topModel = (c.model||'').trim(), topUrl = (c.model_url||'').trim(), topKey = (c.model_key||'').trim();
  const roleModel = (tr.model||'').trim(), roleUrl = (tr.base_url||'').trim();
  const roleKey = roleKeys().target || '';
  return {
    api_key: topKey || roleKey,
    base_url: topUrl || roleUrl,
    model: topModel || roleModel,
    vendor: (tr.vendor||'').trim(),
    source: topModel ? 'settings' : (roleModel ? 'role' : 'none'),
    key_source: topKey ? 'settings' : (roleKey ? 'role' : 'none'),
    role_adapter: tr.adapter || '',
  };
}
function productCfg(){ const c=loadCfg(); return {url:(c.product_url||'').trim(), method:c.product_method||'POST', response_path:(c.product_path||'').trim(), timeout:Number(c.product_timeout)||30, body_template:c.product_body||null, api_key:(c.product_key||'').trim()}; }

async function api(p, opt){
  const r = await fetch(p, opt);
  const t = await r.text();
  let d; try { d = JSON.parse(t); } catch(e){ d = {detail:t}; }
  if(!r.ok) throw new Error(d.detail || ('HTTP '+r.status));
  return d;
}
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct = v => v==null ? '—' : (v<=1 ? (v*100).toFixed(1)+'%' : v.toFixed(2));
/* /api/products 返回的字段名是 source（值为 db / builtin / example），不是 _source */
const srcLabel = s => ({db:'界面创建', builtin:'内置', example:'示例'}[s] || (s ? String(s) : '未知'));

function emptyProducts(){ return '<div class="empty">还没有产品或可用环节。可先接入产品，或加载通用示例。<div style="margin-top:12px"><button class="act" data-load-example>加载通用示例</button> <button class="ghost" data-open-adapter>接入产品</button></div><div data-example-msg></div></div>'; }
document.getElementById('view').addEventListener('click', async e=>{
  if(e.target.closest('[data-open-adapter]')) return setView('adapter');
  const btn=e.target.closest('[data-load-example]'); if(!btn) return;
  btn.disabled=true;
  try{ await api('/api/examples/general',{method:'POST'}); S.products=await api('/api/products'); S.ledProduct=null; S.ledStage=null; setView(S.view); }
  catch(err){ btn.closest('.empty').querySelector('[data-example-msg]').textContent='加载失败：'+err.message; btn.disabled=false; }
});

function setView(v){
  S.view = v;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on', b.dataset.v===v));
  const names = {overview:['Overview','总览'], ledger:['Ledger','指标台账'], datasets:['Datasets','评测集'],
                 prompts:['Prompts','Prompt 版本'], run:['Run','运行评测'],
                 runs:['Runs','运行记录与报告'], compare:['Compare','指标对比'], versions:['Versions','版本记录'], adapter:['Adapter','接入产品'],
                 models:['Models','模型角色'], settings:['Settings','设置'], modelRun:['Model','模型评测'], agentRun:['Agent','Agent 评测'], uiRun:['Interface','产品界面评测']};
  document.getElementById('eyebrow').textContent = names[v][0];
  document.getElementById('title').textContent = names[v][1];
  document.getElementById('hdmeta').textContent = '';
  const dd = new Date();
  document.getElementById('hddate').textContent =
    `${dd.getFullYear()}.${String(dd.getMonth()+1).padStart(2,'0')}.${String(dd.getDate()).padStart(2,'0')}`;
  ({overview:viewOverview, ledger:viewLedger, datasets:viewDatasets, prompts:viewPrompts, run:viewRun,
    versions:viewVersions, runs:viewRuns, compare:viewCompare, adapter:viewAdapter, models:viewModels, settings:viewSettings,
    modelRun:()=>viewRun('model'), agentRun:()=>viewRun('agent'), uiRun:viewProductUI})[v]();
}
document.getElementById('nav').addEventListener('click', e=>{
  const b = e.target.closest('button');
  if(b){ S.cur = null; setView(b.dataset.v); }
});

/* ─────────── 评测集 ─────────── */
async function viewDatasets(){
  S.datasets = await api('/api/datasets');
  let q = {pending:[], approved:[], rejected:[]};
  try{ q = await api('/api/datasets/queue'); }catch(e){}
  S.dsQueue = q;
  const nPend = (q.pending||[]).length, nOk = (q.approved||[]).length, nBad = (q.rejected||[]).length;
  const f = S.dsFilter || '';
  const shown = S.datasets.filter(d=>{
    const rv = d.reviewed || '';
    if(f==='pending') return !rv;
    if(f==='approved') return rv==='yes';
    if(f==='rejected') return rv==='no';
    return true;
  });
  const qbtn = (k, label) => `<button class="ghost mini" data-q="${k}"
    style="margin-left:6px${f && f===k?';color:var(--accent);text-decoration:underline':''}">${label}</button>`;
  const rvBadge = d => d.reviewed==='yes' ? '<span class="rbg y">已复核</span>'
    : d.reviewed==='no' ? `<span class="rbg n" title="${esc(d.review_note||'')}">未通过</span>`
    : '<span class="rbg">未复核</span>';
  const v = document.getElementById('view');
  v.innerHTML = `
    <div class="note" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <span>待复核 <b class="num">${nPend}</b> 条
        ${nPend ? '<span style="color:var(--ink3)">— 这些题还没人读过，跑出来的分数不能直接当结论</span>'
                : '<span style="color:var(--ok)">— 没有待复核的题了</span>'}</span>
      <span style="margin-left:auto;display:flex;align-items:center">
        ${qbtn('pending','待复核 '+nPend)}${qbtn('approved','已复核 '+nOk)}${qbtn('rejected','未通过 '+nBad)}${qbtn('','全部 '+S.datasets.length)}
      </span>
    </div>
    <h2>上传评测集<span class="c">JSON 或 CSV</span></h2>
    <div class="row">
      <div>
        <label>选择产品 / 环节（用于归类）</label>
        <div class="row">
          <select id="dsProduct">${S.products.map(p=>`<option value="${p.product}">${esc(p.name)}</option>`).join('')}</select>
          <select id="dsStage"></select>
        </div>
      </div>
      <div>
        <label>文件</label>
        <div class="drop" id="drop">
          <div class="ico" id="dropIco">＋</div>
          <div class="txt" id="dropTxt">
            <b>点击选择 或 拖拽文件到这里</b>
            <span>JSON（本项目格式）/ CSV（表头 id,stratum,input,gold）</span>
          </div>
        </div>
        <input type="file" id="dsFile" accept=".json,.csv" style="display:none">
      </div>
    </div>
    <div class="note">
      每条用例必须带 <code>id</code> 和 <code>gold</code>（标准答案）。<b>没有 gold 就无法判分</b>——这是评测和"随便跑跑看"的分界线。
    </div>
    <button class="act" id="dsUp">上传并校验</button>
    <div id="dsResult"></div>
    <h2>已上传<span class="c">${f ? shown.length+' / '+S.datasets.length : S.datasets.length}</span></h2>
    <table><thead><tr><th>名称</th><th>产品/环节</th><th class="r">用例</th><th class="r">上传时间</th><th class="r">这套题可不可信</th><th class="r">复核</th></tr></thead>
    <tbody>${shown.map(d=>`<tr data-id="${d.id}">
      <td class="click">${esc(d.name)}</td><td style="color:var(--ink3)">${esc(d.product)} / ${esc(d.stage)}</td>
      <td class="r num">${d.n_cases}</td><td class="r num" style="color:var(--ink3)">${esc(d.created_at)}</td>
      <td class="r"><button class="ghost" data-verify="${d.id}" data-p="${esc(d.product)}" data-s="${esc(d.stage)}"
        style="padding:2px 10px;font-size:15px">体检</button></td>
      <td class="r" style="white-space:nowrap">
        ${rvBadge(d)}
        ${(d.reviewed==='no'&&d.review_note)?`<span class="lnote" title="${esc(d.review_note)}">${esc(d.review_note)}</span>`:''}
        <div style="margin-top:4px">
          <button class="ghost mini" data-rv="yes" data-did="${d.id}">已复核</button>
          <button class="ghost mini" data-rv="no" data-did="${d.id}" style="margin-left:4px">不通过</button>
        </div>
      </td>
    </tr>`).join('') || `<tr><td colspan="6" class="empty">${
      S.datasets.length ? '这个筛选下没有数据集。点上面的「全部」看所有题。'
        : '还没有评测集，请上传自己的数据。'}</td></tr>`}</tbody></table>
    <div id="verifyOut"></div>
    <div class="endline"></div>
    <div id="dsDetail"></div>`;

  // 自定义上传区：点击 / 拖拽都能选文件，并回显文件名
  const drop = document.getElementById('drop');
  const fileInput = document.getElementById('dsFile');
  const showFile = () => {
    const f = fileInput.files[0];
    if (!f) return;
    drop.classList.add('has');
    document.getElementById('dropIco').textContent = '✓';
    document.getElementById('dropTxt').innerHTML =
      `<b>${esc(f.name)}</b><span>${(f.size/1024).toFixed(1)} KB · 点击可重新选择</span>`;
  };
  drop.onclick = () => fileInput.click();
  fileInput.onchange = showFile;
  ['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev, e=>{
    e.preventDefault(); drop.classList.add('drag-over');
  }));
  ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev, e=>{
    e.preventDefault(); drop.classList.remove('drag-over');
  }));
  drop.addEventListener('drop', e=>{
    if(e.dataTransfer.files.length){ fileInput.files = e.dataTransfer.files; showFile(); }
  });

  const fillStages = () => {
    const pk = document.getElementById('dsProduct').value;
    const p = S.products.find(x=>x.product===pk);
    document.getElementById('dsStage').innerHTML = (p?.stages || []).map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');
  };
  document.getElementById('dsProduct').onchange = fillStages; fillStages();

  // ── 评卷体检：参考答案 / 白卷 / 无脑执行 三条基线对照 ──
  const verify = async (did, product, stage) => {
    const box = document.getElementById('verifyOut');
    box.innerHTML = '<p class="empty">正在跑判分器（不调模型）…</p>';
    let d;
    try{
      d = await api('/api/datasets/verify', {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({product, stage, dataset_id: did, ...modelCfg(), model_api_keys:roleKeys()})});
    }catch(e){ box.innerHTML = `<div class="warn">${esc(e.message)}</div>`; return; }
    if(!d.supported){
      box.innerHTML = `<div class="warn">这套题用的评分器 <b>${esc(d.grader)}</b> 还没有基线定义。${esc(d.reason)}</div>`;
      return;
    }
    const m = k => d.baselines.find(b=>b.key===k)?.metrics || {};
    const gold = d.baselines.find(b=>b.key==='gold'), nul = d.baselines.find(b=>b.key==='null'),
          alw = d.baselines.find(b=>b.key==='always');
    const pct = v => v==null ? '—' : (v*100).toFixed(1)+'%';
    // 列不写死：后端给了 metrics 元信息 / labels 映射就用它的 key+label，否则取各基线指标的并集，
    // 中文名取后端 label，取不到就退回 key 本身。所有基线都没值的列整列不显示。
    const meta = Array.isArray(d.metrics) ? d.metrics.filter(x=>x && x.key) : [];
    const labelOf = Object.assign({}, (d.labels && typeof d.labels === 'object') ? d.labels : {});
    meta.forEach(x=>{ labelOf[x.key] = x.label || labelOf[x.key] || x.key; });
    const allKeys = [];
    (meta.length ? meta.map(x=>x.key) : d.baselines.flatMap(b=>Object.keys(b.metrics||{})))
      .forEach(k=>{ if(k && !allKeys.includes(k)) allKeys.push(k); });
    const cols = allKeys.filter(k => d.baselines.some(b => (b.metrics||{})[k] != null));
    const row = b => `<tr>
      <td>${esc(b.label)}</td>
      <td class="r"><span class="stamp ${b.pass_rate===1?'pass':''}">${b.n_pass}/${d.n_cases}</span></td>
      ${cols.map(k=>`<td class="r ll-num">${pct((b.metrics||{})[k])}</td>`).join('')}
      <td class="r ll-num">${b.fatal}</td></tr>`;
    const verdictTxt = [
      d.verdict.gold_ok
        ? `参考答案 <b class="ok">${d.n_cases}/${d.n_cases} 全过</b> —— 判分器配置正确，题目可解。`
        : `<b class="bad">参考答案只过了 ${pct(d.verdict.gold_rate)}</b> —— 判分器配错了，或这道题无解。先修判分器再看分数。`,
      d.verdict.n_holes
        ? `<b class="bad">有 ${d.verdict.n_holes} 道题「什么都不做」也能过</b>（占 ${pct(d.verdict.null_pass_rate)}）——
           这部分分数是白拿的地板，真实 agent 只有超过它才算有本事。`
        : `<b class="ok">没有白卷题</b> —— 每道题都必须真的做点什么才能过。`,
    ].join('<br>');
    box.innerHTML = `
      <h2 style="margin-top:18px">体检结果<span class="c">${esc(d.dataset)} · ${d.n_cases} 条 · 只跑判分器</span></h2>
      <div class="note">${verdictTxt}</div>
      <div class="cmp"><table class="cmp">
        <thead><tr><th>基线</th><th class="r">通过</th>
          ${cols.map(k=>`<th class="r">${esc(labelOf[k] || k)}</th>`).join('')}
          <th class="r">否决</th></tr></thead>
        <tbody>${d.baselines.map(row).join('')}</tbody></table></div>
      ${d.holes.length ? `<div class="note" style="background:rgba(194,65,45,.07)">
        <b>白卷能过的题</b>：${d.holes.map(x=>`<span class="badge" style="color:var(--bad)">${esc(x)}</span>`).join(' ')}
        <div style="margin-top:6px;color:var(--ink3)">这些题要么补一个「必须给出判断依据」的 gold 字段，
        要么接受它们只是安全底线、不计入主指标。</div></div>` : ''}`;
    box.scrollIntoView({behavior:'smooth', block:'nearest'});
  };
  document.querySelectorAll('[data-verify]').forEach(b=>{
    b.onclick = e => { e.stopPropagation();
      verify(b.dataset.verify, b.dataset.p, b.dataset.s); };
  });

  // ── 复核：有人读过这套题了吗（与 lint 分开记）──
  const review = async (did, ok) => {
    const box = document.getElementById('dsResult');
    let note = '';
    if(!ok){
      note = (prompt('不通过的原因（改题的人只能看到这一句）：') || '').trim();
      if(!note) return;                       // 空原因就不发请求：后端也会 400，白跑一趟
    }
    try{
      await api(`/api/datasets/${did}/review`, {method:'POST',
        headers:{'Content-Type':'application/json'}, body: JSON.stringify({reviewed: ok, note})});
      await viewDatasets();
    }catch(e){
      if(box) box.innerHTML = `<div class="warn">${esc(e.message)}</div>`;
    }
  };
  document.querySelectorAll('[data-rv]').forEach(b=>{
    b.onclick = e => { e.stopPropagation(); review(b.dataset.did, b.dataset.rv==='yes'); };
  });
  document.querySelectorAll('[data-q]').forEach(b=>{
    b.onclick = e => { e.stopPropagation(); S.dsFilter = b.dataset.q; viewDatasets(); };
  });

  document.getElementById('dsUp').onclick = async () => {
    const f = document.getElementById('dsFile').files[0];
    if(!f) return alert('请选择文件');
    const fd = new FormData();
    fd.append('file', f);
    const p = document.getElementById('dsProduct').value, s = document.getElementById('dsStage').value;
    document.getElementById('dsResult').innerHTML = '<p class="empty">上传中…</p>';
    try{
      const d = await api(`/api/datasets?product=${p}&stage=${s}`, {method:'POST', body:fd});
      const result = `
        <div class="warn" style="border-left-color:var(--ok)">
          上传成功：<b class="num">${d.n_cases}</b> 条用例。
          ${d.n_problems ? `<br><b class="bad">发现 ${d.n_problems} 处标注问题</b>：<br>${d.problems.map(esc).join('<br>')}` : '标注完整。'}
        </div>`;
      await viewDatasets();
      const resultBox = document.getElementById('dsResult');
      if (resultBox) resultBox.innerHTML = result;
    }catch(e){ document.getElementById('dsResult').innerHTML = `<div class="warn">${esc(e.message)}</div>`; }
  };

  v.querySelectorAll('tr[data-id]').forEach(tr=>tr.onclick = async ()=>{
    const d = await api('/api/datasets/'+tr.dataset.id);
    const strata = d.strata && Object.keys(d.strata).length
      ? Object.entries(d.strata).map(([k,n])=>`${k} ${n}`).join(' · ') : '未分层';
    document.getElementById('dsDetail').innerHTML = `
      <h2>用例明细<span class="c">${esc(d.meta.name)} · ${d.cases.length} 条</span></h2>
      <div class="note">分层：${esc(strata)}</div>
      <table><thead><tr><th>#</th><th>ID</th><th>分层</th><th>gold 标注</th></tr></thead>
      <tbody>${d.cases.slice(0,60).map((c,i)=>`<tr>
        <td class="num" style="color:var(--ink3)">${i+1}</td><td class="num">${esc(c.id)}</td>
        <td style="color:var(--ink3)">${esc(c.stratum||'-')}</td>
        <td><pre style="margin:0">${esc(JSON.stringify(c.gold).slice(0,180))}</pre></td>
      </tr>`).join('')}</tbody></table>`;
    document.getElementById('dsDetail').scrollIntoView({behavior:'smooth'});
  });
}

  const v = document.getElementById('view');
  S.prompts = await api('/api/prompts');
  v.innerHTML = `
    <h2>新建版本<span class="c">改 prompt 是唯一应该一次只改一个的变量</span></h2>
    <div class="row">
      <div><label>产品</label><select id="pp"><option value="standalone_model">独立模型评测（不关联产品）</option><option value="standalone_agent">独立 Agent 评测（不关联产品）</option>
        ${S.products.map(p=>`<option value="${p.product}">${esc(p.name)}</option>`).join('')}</select></div>
      <div><label>环节</label><select id="ps"></select></div>
    </div>
    <div class="row">
      <div><label>版本号（如 v2-调整规则）</label><input id="pver" placeholder="v1"></div>
      <div><label>备注（这次改了什么）</label><input id="pnote" placeholder="调整输出约束"></div>
    </div>
    <label>模板（必须含 {input} 或 {raw}，否则模型看不到数据）</label>
    <textarea id="ptpl" placeholder="你是一个专业助手……&#10;&#10;【数据】&#10;{input}&#10;&#10;要求：……"></textarea>
    <div class="note">
      可用占位符：<code>{input}</code> 整个输入对象的 JSON、<code>{raw}</code> 输入里的原始文本字段、
      <code>{turns}</code> 多轮对话的用户发言、以及 input 里任意一级字段名（如 <code>{item}</code>）。
    </div>
    <button class="act" id="pSave">保存版本</button>
    <div id="pMsg"></div>
    <h2>已有版本<span class="c">${S.prompts.length}</span></h2>
    <table><thead><tr><th>版本</th><th>产品/环节</th><th>备注</th><th class="r">时间</th></tr></thead>
    <tbody>${S.prompts.map(p=>`<tr><td class="num">${esc(p.version)}</td>
      <td style="color:var(--ink3)">${p.product==='standalone_model'?'独立模型评测':p.product==='standalone_agent'?'独立 Agent 评测':esc(p.product)} / ${esc(p.stage)}</td>
      <td>${esc(p.note||'')}</td><td class="r num" style="color:var(--ink3)">${esc(p.created_at)}</td></tr>`)
      .join('') || '<tr><td colspan="4" class="empty">还没有自定义版本。不建版本也能跑，会使用代码里的默认 prompt。</td></tr>'}</tbody></table>`;

  const fill = () => {
    const key = document.getElementById('pp').value;
    if (key === 'standalone_model' || key === 'standalone_agent') {
      const st = key === 'standalone_model' ? 'model' : 'agent';
      document.getElementById('ps').innerHTML = `<option value="${st}">${st}（${key === 'standalone_model'?'独立模型评测':'独立 Agent 评测'}）</option>`;
      return;
    }
    const p = S.products.find(x=>x.product===key);
    document.getElementById('ps').innerHTML = (p && p.stages || []).map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');
  };
  document.getElementById('pp').onchange = fill; fill();

  document.getElementById('pSave').onclick = async ()=>{
    if(!document.getElementById('ptpl').value.trim()) return alert('模板不能为空');
    try{
      await api('/api/prompts', {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({product:document.getElementById('pp').value, stage:document.getElementById('ps').value,
          version:document.getElementById('pver').value || 'v1',
          note:document.getElementById('pnote').value, template:document.getElementById('ptpl').value})});
      viewPrompts();
    }catch(e){ document.getElementById('pMsg').innerHTML = `<div class="warn">${esc(e.message)}</div>`; }
  };
}

/* ─────────── 产品界面评测 ─────────── */
function viewProductUI(){
  const v = document.getElementById('view');
  v.innerHTML = `
    <div class="note">在隔离浏览器中打开页面，按顺序执行操作和检查。失败后停止；每次运行使用新会话。仅测试可信页面，执行器需要访问目标地址，截图可能包含敏感信息。</div>
    <label for="uiUrl">页面地址</label>
    <input id="uiUrl" type="url" placeholder="https://example.com/" autocomplete="url">
    <h2>测试步骤<span class="c">按顺序执行，最多 100 步</span></h2>
    <div id="uiSteps"></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin:14px 0">
      <button class="ghost" id="uiAdd" type="button">＋ 添加步骤</button>
      <button class="ghost" id="uiExample" type="button">加载简单示例</button>
    </div>
    <div class="note">简单示例使用当前平台首页：点击「总览」、检查标题文字、截图。运行前请确认服务端浏览器能够访问该地址；示例不会修改数据。</div>
    <button class="act" id="uiGo" type="button">运行界面测试</button>
    <div id="uiMsg" role="status" aria-live="polite"></div>
    <div id="uiResults"></div>`;
  const stepsEl = v.querySelector('#uiSteps');
  const options = [['click','点击元素'],['fill','填写文本'],['check_text','检查文本包含'],['check_button','检查按钮状态'],['screenshot','页面截图']];
  function addStep(step={action:'click',selector:''}){
    if(stepsEl.children.length >= 100) return;
    const row = document.createElement('div');
    row.className='verbox';
    row.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b data-number></b><div><button type="button" class="ghost mini" data-up aria-label="上移步骤">↑</button> <button type="button" class="ghost mini" data-down aria-label="下移步骤">↓</button> <button type="button" class="ghost mini" data-remove>删除</button></div></div>
      <label>操作</label><select data-action>${options.map(([value,label])=>`<option value="${value}">${label}</option>`).join('')}</select>
      <div data-selector-box><label>元素定位表达式</label><input data-selector placeholder="例如 #submit 或 button.submit"></div>
      <div data-value-box><label data-value-label>文本</label><input data-value></div>
      <div data-enabled-box><label>期望按钮状态</label><select data-enabled><option value="true">可用</option><option value="false">禁用</option></select></div>`;
    row.querySelector('[data-action]').value=step.action;
    row.querySelector('[data-selector]').value=step.selector || '';
    row.querySelector('[data-value]').value=step.action==='check_text' ? (step.text ?? '') : (step.value ?? '');
    row.querySelector('[data-enabled]').value=String(step.enabled ?? true);
    const update=()=>{
      const a=row.querySelector('[data-action]').value;
      row.querySelector('[data-selector-box]').hidden=a==='screenshot';
      row.querySelector('[data-value-box]').hidden=!['fill','check_text'].includes(a);
      row.querySelector('[data-enabled-box]').hidden=a!=='check_button';
      row.querySelector('[data-value-label]').textContent=a==='fill'?'填写内容':'预期包含的文本';
    };
    row.querySelector('[data-action]').onchange=update;
    row.querySelector('[data-remove]').onclick=()=>{row.remove();renumber();};
    row.querySelector('[data-up]').onclick=()=>{if(row.previousElementSibling) stepsEl.insertBefore(row,row.previousElementSibling);renumber();};
    row.querySelector('[data-down]').onclick=()=>{if(row.nextElementSibling) stepsEl.insertBefore(row.nextElementSibling,row);renumber();};
    stepsEl.appendChild(row); update(); renumber();
  }
  function renumber(){
    [...stepsEl.children].forEach((row,i)=>{
      row.querySelector('[data-number]').textContent='步骤 '+(i+1);
      row.querySelector('[data-up]').disabled=i===0;
      row.querySelector('[data-down]').disabled=i===stepsEl.children.length-1;
    });
    v.querySelector('#uiAdd').disabled=stepsEl.children.length>=100;
  }
  v.querySelector('#uiAdd').onclick=()=>addStep();
  v.querySelector('#uiExample').onclick=()=>{
    v.querySelector('#uiUrl').value=new URL('/',location.href).href;
    stepsEl.replaceChildren();
    addStep({action:'click',selector:'#nav button[data-v="overview"]'});
    addStep({action:'check_text',selector:'#title',text:'总览'});
    addStep({action:'screenshot'});
  };
  addStep();
  v.querySelector('#uiGo').onclick=async ()=>{
    const msg=v.querySelector('#uiMsg'), out=v.querySelector('#uiResults'), button=v.querySelector('#uiGo');
    let url;
    try {
      url=new URL(v.querySelector('#uiUrl').value.trim());
      if(!['http:','https:'].includes(url.protocol) || url.username || url.password) throw Error();
    } catch(e) { msg.innerHTML='<div class="warn">请输入不含账号密码的 HTTP(S) 页面地址。</div>'; return; }
    const steps=[];
    for(const [i,row] of [...stepsEl.children].entries()){
      const action=row.querySelector('[data-action]').value;
      const selector=row.querySelector('[data-selector]').value.trim();
      if(action!=='screenshot' && !selector){msg.innerHTML=`<div class="warn">第 ${i+1} 步需要填写元素定位表达式。</div>`;return;}
      const step={action};
      if(action!=='screenshot') step.selector=selector;
      if(action==='fill') step.value=row.querySelector('[data-value]').value;
      if(action==='check_text') step.text=row.querySelector('[data-value]').value;
      if(action==='check_button') step.enabled=row.querySelector('[data-enabled]').value==='true';
      steps.push(step);
    }
    if(!steps.length){msg.innerHTML='<div class="warn">请至少添加一个测试步骤。</div>';return;}
    button.disabled=true; msg.innerHTML='<p class="empty">正在运行界面测试，请稍候…</p>'; out.innerHTML='';
    try {
      const d=await api('/api/product-ui/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:url.href,steps})});
      if(!d || typeof d.ok!=='boolean' || !Array.isArray(d.steps)) throw Error('接口返回格式不符合约定');
      const error=d.error;
      const errText=error ? `${error.code||'error'}：${error.message||''}${Number.isInteger(error.step_index)?'（步骤 '+(error.step_index+1)+'）':''}` : '';
      msg.innerHTML=`<div class="warn" ${d.ok?'style="border-left-color:var(--ok)"':''}><b>${d.ok?'测试通过':'测试未通过'}</b> · 总耗时 ${esc(d.elapsed_ms ?? '—')} ms${errText?'<br>'+esc(errText):''}</div>`;
      out.innerHTML='<h2>逐步结果</h2>'+(d.steps.length ? d.steps.map((r,i)=>{
        const index=Number.isInteger(r.index)?r.index:i;
        const label=options.find(([a])=>a===r.action)?.[1] || r.action || '未知操作';
        const actual=Object.prototype.hasOwnProperty.call(r,'actual')?`<div>实际结果：<pre>${esc(typeof r.actual==='string'?r.actual:JSON.stringify(r.actual))}</pre></div>`:'';
        const image=typeof r.png_base64==='string' && /^[A-Za-z0-9+/=\s]+$/.test(r.png_base64) ? `<img alt="步骤 ${index+1} 截图" style="display:block;max-width:100%;height:auto;margin-top:10px;border:1px solid var(--line2)" src="data:image/png;base64,${r.png_base64.replace(/\s/g,'')}">` : '';
        return `<div class="verbox"><b>步骤 ${index+1} · ${esc(label)}</b> <span class="stamp ${r.ok?'pass':''}">${r.ok?'通过':'失败'}</span> <span>${esc(r.elapsed_ms ?? '—')} ms</span>${actual}${image}</div>`;
      }).join(''):'<p class="empty">没有已执行的步骤。</p>')+(d.steps.length<steps.length?`<p class="note">剩余 ${steps.length-d.steps.length} 步未执行。</p>`:'');
    } catch(e) { msg.innerHTML=`<div class="warn">请求失败：${esc(e.message)}。请确认产品界面接口已接入并可访问。</div>`; }
    finally {button.disabled=false;}
  };
}

    S.datasets = await api('/api/datasets');

  } catch(e) {
    if (['modelRun','agentRun','run'].includes(S.view)) v.innerHTML = `<div class="warn">加载评测配置失败：${esc(e.message)}</div>`;

                  .filter(g => g && (g.key || g.real));

      <label>已保存的被测模型<span class="c">来自「模型与API配置」</span></label>

        ${roleRows.map(r=>`<option value="${esc(r.role)}" ${S.pickRole===r.role?'selected':''}>${esc(roleLabel(r))} · ${esc(r.vendor||'—')} / ${esc(r.model||'—')}${r.adapter==='mock'?'（mock 仿真）':''}</option>`).join('')}
